<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#D4AF37">
    <link rel="apple-touch-startup-image" href="/splash.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ZeusChat">
    <link rel="apple-touch-icon" href="/zeuschat-icon.png">
    <title>ZeusChat - Ghost Mode Messaging</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', -apple-system, BlinkMacSystemFont, 'Segoe UI', serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0d0d0d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 380px;
            width: 100%;
            margin: 0 auto;
        }

        /* Main Card - Gold/Black Theme */
        .card {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 48px 24px;
            text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.1);
        }

        /* 3D Spinning Logo Container - Using Real Image */
        .logo-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 24px;
            perspective: 800px;
        }

        .logo-3d {
            width: 100%;
            height: 100%;
            position: relative;
            animation: spin3D 8s infinite linear;
            transform-style: preserve-3d;
        }

        .logo-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: visible;
            overflow: hidden;
        }

        .logo-face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-face-front {
            transform: translateZ(40px);
        }

        .logo-face-back {
            transform: rotateY(180deg) translateZ(40px);
        }

        .logo-face-right {
            transform: rotateY(90deg) translateZ(40px);
        }

        .logo-face-left {
            transform: rotateY(-90deg) translateZ(40px);
        }

        .logo-face-top {
            transform: rotateX(90deg) translateZ(40px);
        }

        .logo-face-bottom {
            transform: rotateX(-90deg) translateZ(40px);
        }

        @keyframes spin3D {
            0% { transform: rotateY(0deg) rotateX(0deg); }
            100% { transform: rotateY(360deg) rotateX(360deg); }
        }

        /* Simple fallback for browsers that don't support 3D */
        .simple-logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            display: none;
        }
        .simple-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @supports not (transform-style: preserve-3d) {
            .logo-3d {
                display: none;
            }
            .simple-logo {
                display: block;
            }
        }

        /* Gold Text Styling */
        h1 {
            font-size: 36px;
            color: #D4AF37;
            margin-bottom: 8px;
            letter-spacing: 4px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .ghost-mode {
            font-size: 12px;
            color: rgba(212, 175, 55, 0.8);
            letter-spacing: 4px;
            margin-bottom: 12px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .tagline {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
            font-style: italic;
            letter-spacing: 1px;
        }

        /* Gold Buttons */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #D4AF37 0%, #B8960C 100%);
            color: #0a0a0a;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(212, 175, 55, 0.4);
            background: linear-gradient(135deg, #E5C65C 0%, #C9A52C 100%);
        }

        .btn-secondary {
            width: 100%;
            padding: 16px;
            background: transparent;
            color: #D4AF37;
            border: 2px solid #D4AF37;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-secondary:hover {
            background: rgba(212, 175, 55, 0.1);
            transform: translateY(-2px);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 30px 0 20px;
            color: rgba(212, 175, 55, 0.3);
            font-size: 12px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #D4AF37, transparent);
        }

        /* Footer */
        .footer {
            margin-top: 24px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* Install PWA Button */
        .install-pwa {
            background: rgba(212, 175, 55, 0.1);
            border: 1px dashed #D4AF37;
            padding: 12px;
            border-radius: 40px;
            margin-top: 20px;
            font-size: 12px;
            color: #D4AF37;
            cursor: pointer;
        }

        .install-pwa:hover {
            background: rgba(212, 175, 55, 0.2);
        }

/* Mobile Responsive Styles */
@media (max-width: 768px) {
    body {
        padding: 16px;
    }

    .container, .card, .main-content {
        padding: 20px 16px;
        margin: 0;
        width: 100%;
        border-radius: 24px;
    }

    h1 {
        font-size: 28px;
    }

    h2 {
        font-size: 22px;
    }

    button, .btn-primary, .btn-secondary {
        padding: 14px 20px;
        font-size: 16px;
    }

    input, textarea, select {
        padding: 14px;
        font-size: 16px;
    }

    .sidebar {
        position: fixed;
        left: -280px;
        transition: left 0.3s;
        z-index: 1000;
    }

    .sidebar.open {
        left: 0;
    }

    .menu-toggle {
        display: block;
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 1001;
        background: #D4AF37;
        border: none;
        border-radius: 8px;
        padding: 10px;
        cursor: pointer;
    }

    .main-content {
        margin-left: 0;
        padding: 60px 16px 20px;
    }

    .admin-table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
    }

    .feature-grid, .pricing-grid {
        grid-template-columns: 1fr;
    }

    .chat-container {
        flex-direction: column;
    }

    .message {
        max-width: 85%;
    }

    body {
        font-size: 14px;
    }

    button, a, .clickable {
        min-height: 44px;
    }
}
    </style>
  <link rel="stylesheet" href="/static/mobile.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- 3D Spinning Logo with Real ZeusChat Icon -->
            <div class="logo-container">
                <div class="logo-3d">
                    <div class="logo-face logo-face-front">
                        <img src="/zeuschat-icon.png" alt="ZeusChat Logo">
                    </div>
                    <div class="logo-face logo-face-back">
                        <img src="/zeuschat-icon.png" alt="ZeusChat Logo">
                    </div>
                    <div class="logo-face logo-face-right">
                        <img src="/zeuschat-icon.png" alt="ZeusChat Logo">
                    </div>
                    <div class="logo-face logo-face-left">
                        <img src="/zeuschat-icon.png" alt="ZeusChat Logo">
                    </div>
                    <div class="logo-face logo-face-top">
                        <img src="/zeuschat-icon.png" alt="ZeusChat Logo">
                    </div>
                    <div class="logo-face logo-face-bottom">
                        <img src="/zeuschat-icon.png" alt="ZeusChat Logo">
                    </div>
                </div>
                <div class="simple-logo">
                    <img src="/zeuschat-icon.png" alt="ZeusChat Logo">
                </div>
            </div>

            <h1>ZEUSCHAT</h1>
            <div class="ghost-mode">GHOST MODE MESSAGING</div>
            <div class="tagline">Simple. Secure. Reliable.</div>

            <!-- Get Started Button -->
            <button class="btn-primary" id="getStartedBtn">Get Started →</button>

            <!-- Login Button -->
            <button class="btn-secondary" id="loginBtn">Login</button>

            <div class="divider">
                <div class="divider-line"></div>
                <span>✦</span>
                <div class="divider-line"></div>
            </div>

            <!-- PWA Install Button -->
            <button id="installBtn" class="install-pwa" style="display: none;">
                📱 Install ZeusChat App
            </button>

            <div id="mobileQrWrap" style="display:none; margin-top: 20px;">
                <div style="color: rgba(212,175,55,0.75); font-size: 11px; letter-spacing: 1px; margin-bottom: 8px;">SCAN TO OPEN MOBILE INSTALL</div>
                <div id="mobileInstallQr" style="display:flex; justify-content:center;"></div>
            </div>

            <div class="footer">
                🔒 End-to-end encrypted • No phone number required • Your privacy matters
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
        // Get Started button - redirect to registration
        document.getElementById('getStartedBtn').addEventListener('click', () => {
              window.location.href = '/mobile/email';
        });

        // Login button - redirect to login
        document.getElementById('loginBtn').addEventListener('click', () => {
              window.location.href = '/mobile/login';
        });

        // PWA Install Prompt
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
        const mobileQrWrap = document.getElementById('mobileQrWrap');

        if (!isMobile && mobileQrWrap) {
            mobileQrWrap.style.display = 'block';
            const qrDiv = document.getElementById('mobileInstallQr');
            if (qrDiv && typeof QRCode !== 'undefined') {
                new QRCode(qrDiv, {
                    text: window.location.origin + '/mobile',
                    width: 130,
                    height: 130,
                    colorDark: '#111111',
                    colorLight: '#D4AF37',
                    correctLevel: QRCode.CorrectLevel.H
                });
            }
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('User installed PWA');
                }
                deferredPrompt = null;
                installBtn.style.display = 'none';
            } else {
                alert('Tap Share → Add to Home Screen (iPhone) or Menu → Install App (Android)');
            }
        });

        // Hide install button if already installed
        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
        });
    </script>
</body>
</html>
