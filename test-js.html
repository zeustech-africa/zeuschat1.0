<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>JS Test</title>
  <style>

/* Mobile Responsive Styles */
@media (max-width: 768px) {
  body {
    padding: 16px;
  }

  .container, .card, .main-content {
    padding: 20px 16px;
    margin: 0;
    width: 100%;
    border-radius: 24px;
  }

  h1 {
    font-size: 28px;
  }

  h2 {
    font-size: 22px;
  }

  button, .btn-primary, .btn-secondary {
    padding: 14px 20px;
    font-size: 16px;
  }

  input, textarea, select {
    padding: 14px;
    font-size: 16px;
  }

  .sidebar {
    position: fixed;
    left: -280px;
    transition: left 0.3s;
    z-index: 1000;
  }

  .sidebar.open {
    left: 0;
  }

  .menu-toggle {
    display: block;
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 1001;
    background: #D4AF37;
    border: none;
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
  }

  .main-content {
    margin-left: 0;
    padding: 60px 16px 20px;
  }

  .admin-table {
    display: block;
    overflow-x: auto;
    white-space: nowrap;
  }

  .feature-grid, .pricing-grid {
    grid-template-columns: 1fr;
  }

  .chat-container {
    flex-direction: column;
  }

  .message {
    max-width: 85%;
  }

  body {
    font-size: 14px;
  }

  button, a, .clickable {
    min-height: 44px;
  }
}
  </style>
  <link rel="stylesheet" href="/static/mobile.css">
</head>
<body>
  <h1 id="status">Testing...</h1>
  <button id="test-btn" onclick="testClick()">Click Me (inline)</button>
  <button id="test-btn-2">Click Me (addEventListener)</button>
  
  <script>
    console.log('JavaScript is loading...');
    
    function testClick() {
      document.getElementById('status').textContent = 'Inline onclick works! ✅';
      console.log('Inline onclick fired');
    }
    
    document.addEventListener('DOMContentLoaded', () => {
      console.log('DOMContentLoaded fired');
      document.getElementById('status').textContent = 'JavaScript loaded ✅';
      
      const btn2 = document.getElementById('test-btn-2');
      if (btn2) {
        btn2.addEventListener('click', () => {
          document.getElementById('status').textContent = 'addEventListener works! ✅';
          console.log('addEventListener fired');
        });
      }
    });
  </script>
</body>
</html>
