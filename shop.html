<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Ghost Market</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background: #000; color: #fff; }
        .shop-header { background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%); padding: 40px 20px; text-align: center; }
        .shop-avatar { width: 100px; height: 100px; border-radius: 50%; background: #34B7F1; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 48px; }
        .shop-name { font-size: 28px; font-weight: bold; margin-bottom: 8px; }
        .shop-stats { display: flex; justify-content: center; gap: 30px; margin: 20px 0; }
        .stat { text-align: center; }
        .stat-value { font-size: 24px; font-weight: bold; color: #34B7F1; }
        .stat-label { font-size: 12px; color: #667781; }
        .follow-btn { background: #34B7F1; color: white; border: none; padding: 10px 30px; border-radius: 30px; font-size: 16px; cursor: pointer; }
        .listing-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .listing-card { background: #1a1a1a; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .listing-card:hover { transform: translateY(-5px); }
        .listing-image { width: 100%; height: 200px; background: #2a2a2a; object-fit: cover; }
        .listing-info { padding: 15px; }
        .listing-title { font-size: 16px; font-weight: 500; margin-bottom: 5px; }
        .listing-price { font-size: 18px; font-weight: bold; color: #34B7F1; }
        .rating { display: flex; align-items: center; gap: 5px; margin-top: 8px; }
        .stars { color: #FFD700; font-size: 12px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #0a0a0a; border-bottom: 1px solid #2a2a2a; }
        .back-btn { background: none; border: none; color: #34B7F1; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="nav-bar">
        <button class="back-btn" onclick="history.back()">← Back to Market</button>
        <span>Ghost Market</span>
        <div style="width: 80px;"></div>
    </div>
    
    <div id="shop-content">
        <div class="shop-header">
            <div class="shop-avatar">🏪</div>
            <div class="shop-name" id="shop-name">Loading...</div>
            <div class="shop-stats">
                <div class="stat">
                    <div class="stat-value" id="item-count">0</div>
                    <div class="stat-label">Items</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="followers-count">0</div>
                    <div class="stat-label">Followers</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="rating-value">0</div>
                    <div class="stat-label">Rating</div>
                </div>
            </div>
            <button class="follow-btn" id="follow-btn" onclick="toggleFollow()">Follow Shop</button>
        </div>
        <div id="listings-grid" class="listing-grid">
            <div style="text-align: center; padding: 40px;">Loading listings...</div>
        </div>
    </div>

    <script>
        let sellerId = null;
        let isFollowing = false;
        
        // Get seller ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        sellerId = urlParams.get('id');
        
        async function loadShop() {
            const response = await fetch(`/api/market/shop/${sellerId}`);
            const data = await response.json();
            
            if (data.success) {
                document.getElementById('shop-name').textContent = data.shop.name;
                document.getElementById('item-count').textContent = data.shop.item_count;
                document.getElementById('followers-count').textContent = data.shop.followers;
                document.getElementById('rating-value').textContent = data.shop.rating.toFixed(1);
                isFollowing = data.shop.is_following;
                document.getElementById('follow-btn').textContent = isFollowing ? 'Following' : 'Follow Shop';
                
                renderListings(data.listings);
            }
        }
        
        function renderListings(listings) {
            const grid = document.getElementById('listings-grid');
            if (listings.length === 0) {
                grid.innerHTML = '<div style="text-align: center; padding: 40px;">No listings yet</div>';
                return;
            }
            
            grid.innerHTML = listings.map(listing => `
                <div class="listing-card" onclick="location.href='/market.html?listing=${listing.id}'">
                    <img class="listing-image" src="${listing.images?.[0] || '/static/images/placeholder.jpg'}" alt="${listing.title}">
                    <div class="listing-info">
                        <div class="listing-title">${listing.title}</div>
                        <div class="listing-price">R${listing.price}</div>
                        <div class="rating">
                            <span class="stars">${'★'.repeat(Math.floor(listing.rating || 0))}${'☆'.repeat(5 - Math.floor(listing.rating || 0))}</span>
                            <span>(${listing.rating_count || 0})</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        async function toggleFollow() {
            const response = await fetch(`/api/market/shop/${sellerId}/follow`, { method: 'POST' });
            const data = await response.json();
            if (data.success) {
                isFollowing = !isFollowing;
                document.getElementById('follow-btn').textContent = isFollowing ? 'Following' : 'Follow Shop';
                document.getElementById('followers-count').textContent = data.new_followers;
            }
        }
        
        loadShop();
    </script>
</body>
</html>
