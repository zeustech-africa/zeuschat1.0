<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Apply to Sell - Ghost Market</title>
    <link rel="stylesheet" href="/static/mobile.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .card {
            background: rgba(17, 17, 17, 0.95);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 24px;
            padding: 24px;
        }
        h1 { color: #D4AF37; margin-bottom: 8px; }
        .subtitle { color: rgba(255,255,255,0.6); margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #D4AF37;
        }
        input, textarea {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 12px;
            color: white;
            font-size: 16px;
        }
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #D4AF37 0%, #B8960C 100%);
            color: #0a0a0a;
            border: none;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            min-height: 44px;
        }
        .back-link {
            color: #D4AF37;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/ghost-market" class="back-link">← Back to Ghost Market</a>

        <div class="card">
            <h1>📦 Apply to Become a Seller</h1>
            <p class="subtitle">Note: Only Pro and Teams subscribers can sell on Ghost Market.</p>

            <div class="form-group">
                <label>Store Name</label>
                <input type="text" id="storeName" placeholder="Your store name">
            </div>

            <div class="form-group">
                <label>Store Description (Optional)</label>
                <textarea id="storeDescription" rows="3" placeholder="Tell buyers about your store..."></textarea>
            </div>

            <button id="submitBtn" class="btn-primary">Submit Application</button>
        </div>
    </div>

    <script>
        document.getElementById('submitBtn').addEventListener('click', async function () {
            const storeName = document.getElementById('storeName').value.trim();
            const storeDescription = document.getElementById('storeDescription').value.trim();

            if (!storeName) {
                alert('Please enter a store name');
                return;
            }

            try {
                const response = await fetch('/api/ghost-market/apply-seller', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ store_name: storeName, store_description: storeDescription })
                });

                const data = await response.json();
                if (data.success) {
                    alert('Application submitted! Admin will review and notify you.');
                    window.location.href = '/ghost-market';
                } else {
                    alert(data.error || 'Application failed');
                }
            } catch (err) {
                alert('Network error. Please try again.');
            }
        });
    </script>
</body>
</html>
