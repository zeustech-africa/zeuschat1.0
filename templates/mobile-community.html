<!DOCTYPE html>
<html lang="{{ initial_language or 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>ZeusChat - Community</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0a0a0a;
            --panel: #141414;
            --gold: #d4af37;
            --muted: rgba(255, 255, 255, 0.64);
            --border: rgba(212, 175, 55, 0.2);
            --text: #fff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            color: var(--text);
            background: radial-gradient(circle at top, rgba(212, 175, 55, 0.08), transparent 35%), var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topbar button {
            border: none;
            background: none;
            color: var(--gold);
            font-size: 18px;
            cursor: pointer;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px 16px;
        }

        h1 {
            color: var(--gold);
            font-size: 22px;
            margin-bottom: 10px;
        }

        p {
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 14px;
        }

        .link-btn {
            display: block;
            width: 100%;
            margin-top: 10px;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            background: #1d1d1d;
            color: var(--text);
            text-align: left;
            cursor: pointer;
            font: inherit;
        }

        .primary {
            border: none;
            color: #111;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold), #b8960c);
        }

        .language-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            align-items: flex-end;
            justify-content: center;
        }
        .language-modal.open { display: flex; }
        .language-modal-content {
            background: #1a1a1a;
            border-radius: 20px 20px 0 0;
            padding: 24px 16px 32px;
            width: 100%;
            max-width: 480px;
        }
        .language-modal-content h3 {
            color: var(--gold);
            margin-bottom: 12px;
            font-size: 17px;
        }
        .language-modal-content button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #222;
            color: var(--text);
            font: inherit;
            cursor: pointer;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <button type="button" onclick="window.location.href='/mobile/chat'" aria-label="Back">&#8592;</button>
        <button type="button" onclick="openLanguageModal()" aria-label="Change Language">&#127760;</button>
        <button type="button" onclick="window.location.href='/mobile/settings'" aria-label="Settings">&#9881;</button>
    </div>

    <div class="card">
        <h1 data-i18n="community">Community</h1>
        <p data-i18n="community_description">Explore the Ghost Community feed.</p>
        <button class="link-btn primary" type="button" onclick="window.location.href='/mobile/chat'" data-i18n="go_to_messages">Go to Messages</button>
        <button class="link-btn" type="button" onclick="window.location.href='/mobile/market'" data-i18n="open_market">Open Market</button>
        <button class="link-btn" type="button" onclick="window.location.href='/mobile/profile'" data-i18n="open_profile">Open Profile</button>
    </div>

    <div id="languageModal" class="language-modal" aria-hidden="true">
        <div class="language-modal-content">
            <h3 data-i18n="select_language">Select Language</h3>
            <button type="button" onclick="setLanguage('en')">English</button>
            <button type="button" onclick="setLanguage('sw')">Kiswahili</button>
            <button type="button" onclick="setLanguage('yo')">Yoruba</button>
            <button type="button" onclick="setLanguage('zu')">isiZulu</button>
            <button type="button" onclick="setLanguage('ha')">Hausa</button>
            <button type="button" onclick="setLanguage('ig')">Igbo</button>
            <button type="button" onclick="setLanguage('am')">Amharic</button>
            <button type="button" onclick="setLanguage('xh')">isiXhosa</button>
            <button type="button" onclick="setLanguage('af')">Afrikaans</button>
            <button type="button" onclick="setLanguage('st')">Sesotho</button>
            <button type="button" onclick="setLanguage('tn')">Setswana</button>
            <button type="button" onclick="setLanguage('nso')">Sepedi</button>
            <button type="button" onclick="closeLanguageModal()" data-i18n="cancel">Cancel</button>
        </div>
    </div>

    <script>
        const SUPPORTED_LANGUAGES = ['en', 'sw', 'yo', 'zu', 'ha', 'ig', 'am', 'xh', 'af', 'st', 'tn', 'nso'];
        const initialLanguage = {{ initial_language|tojson }};

        function normalizeLanguage(lang) {
            return SUPPORTED_LANGUAGES.includes(lang) ? lang : 'en';
        }

        let currentTranslations = {};

        async function loadLanguage(lang) {
            lang = normalizeLanguage(lang);
            try {
                const r = await fetch('/static/locales/' + lang + '.json?v=1');
                if (!r.ok) throw new Error('fetch failed');
                currentTranslations = await r.json();
            } catch(e) {
                currentTranslations = {};
            }
            applyTranslations();
            document.documentElement.lang = lang;
            localStorage.setItem('zeuschat_lang', lang);
        }

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (currentTranslations[key]) el.textContent = currentTranslations[key];
            });
        }

        function openLanguageModal() {
            const m = document.getElementById('languageModal');
            m.classList.add('open');
            m.setAttribute('aria-hidden', 'false');
        }

        function closeLanguageModal() {
            const m = document.getElementById('languageModal');
            m.classList.remove('open');
            m.setAttribute('aria-hidden', 'true');
        }

        async function setLanguage(lang) {
            closeLanguageModal();
            await loadLanguage(lang);
            try {
                const csrf = document.querySelector('meta[name="csrf-token"]').content;
                await fetch('/api/user/language', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
                    credentials: 'include',
                    body: JSON.stringify({ language: lang })
                });
            } catch(e) {}
        }

        const savedLang = normalizeLanguage(localStorage.getItem('zeuschat_lang') || initialLanguage || 'en');
        loadLanguage(savedLang);
    </script>
</body>
</html>
