<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP — ZeusChat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #000;
      overflow: hidden;
      height: 100vh;
      color: #fff;
    }
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 0;
    }
    .header {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .logo {
      height: 32px;
      margin-bottom: 4px;
    }
    .byline {
      font-size: 12px;
      color: #FFD700;
      font-weight: 500;
    }
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .box {
      background: #222;
      border-radius: 12px;
      padding: 24px;
      margin: 16px 0;
      width: 100%;
      max-width: 600px;
      text-align: left;
    }
    .box-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #fff;
    }
    .input-group {
      margin-bottom: 16px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: #333;
      border: 1px solid #444;
      color: #fff;
      border-radius: 6px;
    }
    .btn {
      background: #FFD700;
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 16px;
      width: 100%;
      max-width: 400px;
    }
    .note {
      background: #1a1a1a;
      border-left: 4px solid #d4af37;
      padding: 12px;
      margin-top: 16px;
      font-size: 13px;
      text-align: left;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <video class="video-bg" autoplay muted loop>
    <source src="zeustech-register.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <!-- Top-left: Logo + Byline -->
  <div class="header">
    <img src="zeustech-logo-zeushchat.png" class="logo" alt="ZeusTech">
    <div class="byline">ZeusChat by ZeusTech</div>
  </div>

  <div class="container">
    <div class="box">
      <div class="box-title">Enter OTP Code</div>
      <div class="input-group">
        <input type="text" id="otp" placeholder="Enter 6-digit code" maxlength="6" value="123456" />
      </div>
      <button class="btn" id="verifyBtn" onclick="verifyOTP()">Verify</button>
      <div class="note" style="background: #2a2a1a; border-color: #FFD700;">
        <strong>🧪 Test Mode:</strong> Use code <strong>123456</strong> (auto-filled)<br>
        Click "Verify" to continue.
      </div>
    </div>
  </div>

  <script>
    // Enforce step-locked flow
    const pendingEmail = localStorage.getItem('pending_email');
    if (!pendingEmail) {
      alert('Session expired. Please start over.');
      window.location.href = 'emailinput.html';
    }

    document.getElementById('otp').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        verifyOTP();
      }
    });

    async function verifyOTP() {
      const otpInput = document.getElementById('otp');
      const verifyBtn = document.getElementById('verifyBtn');

      if (verifyBtn.disabled) return;
      verifyBtn.disabled = true;
      verifyBtn.textContent = 'Verifying...';

      const otp = otpInput.value.trim();

      if (!otp || otp.length !== 6) {
        alert('Please enter a 6-digit OTP code.');
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'Verify';
        return;
      }

      // For ZeusChat 1.0, OTP is always 123456 (as per spec)
      if (otp === '123456') {
        const email = localStorage.getItem('pending_email');
        const API_BASE = window.location.origin;
        
        try {
          console.log('🔐 ===== OTP VERIFICATION STARTING =====');
          console.log('📧 Email:', email);
          console.log('🔑 OTP:', otp);
          console.log('🌐 API Base:', API_BASE);
          console.log('🌐 Current URL:', window.location.href);
          console.log('🌐 Origin:', window.location.origin);
          
          const url = `${API_BASE}/api/verify-otp`;
          console.log('📡 Calling URL:', url);
          
          console.log('📤 Request payload:', JSON.stringify({ email, otp }));
          
          // Step 1: Verify OTP with backend - get zeus_pin
          const verifyResponse = await fetch(url, {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({ email, otp })
          });
          
          console.log('📊 Response Status:', verifyResponse.status);
          console.log('📊 Response OK:', verifyResponse.ok);
          console.log('📊 Response Status Text:', verifyResponse.statusText);
          
          // Log all response headers
          const headers = {};
          verifyResponse.headers.forEach((value, key) => {
            headers[key] = value;
          });
          console.log('📊 Response Headers:', headers);
          
          // Check content type before parsing
          const contentType = verifyResponse.headers.get('content-type');
          console.log('📊 Content-Type:', contentType);
          
          if (!contentType || !contentType.includes('application/json')) {
            // If not JSON, get the raw text
            const text = await verifyResponse.text();
            console.error('❌ Non-JSON response received!');
            console.error('❌ Response body (first 500 chars):', text.substring(0, 500));
            throw new Error(`Server returned non-JSON response (${verifyResponse.status}): ${text.substring(0, 200)}`);
          }
          
          const verifyResult = await verifyResponse.json();
          console.log('✅ Response Data:', verifyResult);
          console.log('✅ Success flag:', verifyResult.success);
          console.log('✅ Zeus PIN:', verifyResult.zeus_pin);
          
          if (verifyResponse.ok && verifyResult.success && verifyResult.zeus_pin) {
            console.log('✅ ===== OTP VERIFIED SUCCESSFULLY =====');
            console.log('✅ Zeus PIN generated:', verifyResult.zeus_pin);
            
            // Save zeus_pin and email to localStorage for profile creation
            localStorage.setItem('my_zeus_pin', verifyResult.zeus_pin);
            localStorage.setItem('registration_email', email);
            
            console.log('💾 Saved to localStorage:');
            console.log('  - my_zeus_pin:', localStorage.getItem('my_zeus_pin'));
            console.log('  - registration_email:', localStorage.getItem('registration_email'));
            
            console.log('🔀 Redirecting to profile-create.html...');
            
            // Redirect to profile creation
            window.location.href = 'profile-create.html';
          } else {
            console.error('❌ ===== OTP VERIFICATION FAILED =====');
            console.error('❌ Response:', verifyResult);
            console.error('❌ Status:', verifyResponse.status);
            console.error('❌ Success:', verifyResult.success);
            console.error('❌ Zeus PIN:', verifyResult.zeus_pin);
            throw new Error(verifyResult.error || verifyResult.message || 'OTP verification failed');
          }
        } catch (error) {
          console.error('❌ ===== ERROR OCCURRED =====');
          console.error('❌ Error type:', error.constructor.name);
          console.error('❌ Error message:', error.message);
          console.error('❌ Error stack:', error.stack);
          
          // Show detailed error to user
          alert(`❌ OTP Verification Error:\n\n${error.message}\n\n📋 Check browser console (F12) for details.`);
          
          verifyBtn.disabled = false;
          verifyBtn.textContent = 'Verify';
        }
      } else {
        console.warn('⚠️ Invalid OTP entered:', otp);
        alert('Invalid OTP code. Please enter 123456');
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'Verify';
      }
    }
  </script>
</body>
</html>
