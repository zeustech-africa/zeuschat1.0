<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Verification - ZeusChat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-y: auto;
        }
        .container {
            max-width: 680px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 32px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }
        h2 {
            color: #1e293b;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #64748b;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .upload-area {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .upload-label {
            display: block;
            font-weight: 600;
            margin-bottom: 12px;
            color: #334155;
        }
        input[type="file"] {
            margin: 10px 0;
        }
        .preview-image {
            max-width: 220px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin: 15px 0;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: #667eea;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .match-result {
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
        }
        .match-result.passed { background: #d1fae5; color: #065f46; }
        .match-result.failed { background: #fee2e2; color: #991b1b; }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .pin-badge {
            background: #f1f5f9;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Identity Verification</h2>
            <p class="subtitle">ZeusChat is a premium secure platform. Please verify your identity.</p>

            <div class="pin-badge">
                <strong>Your Zeus-PIN:</strong> <span id="zeusPinDisplay"></span>
                <p style="font-size: 12px; margin-top: 5px;">Save this PIN - you need it to login.</p>
            </div>

            <div class="upload-area">
                <label class="upload-label">Document Type</label>
                <div class="radio-group">
                    <label><input type="radio" name="document_type" value="passport" checked> Passport</label>
                    <label><input type="radio" name="document_type" value="national_id"> National ID</label>
                </div>
            </div>

            <div class="upload-area">
                <label class="upload-label">Upload ID Document</label>
                <input type="file" id="idDocument" accept="image/jpeg,image/png,application/pdf" required>
                <div id="idPreview"></div>
                <p style="font-size: 12px; color: #64748b;">Supported: JPG, PNG, PDF. Max 5MB.</p>
            </div>

            <div class="upload-area">
                <label class="upload-label">Take a Selfie</label>
                <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; align-items: center;">
                    <button type="button" id="openCameraBtn" style="padding: 8px 16px; background: #64748b; color: white; border: none; border-radius: 8px; cursor: pointer;">Open Camera</button>
                    <span>or</span>
                    <input type="file" id="selfieUpload" accept="image/jpeg,image/png">
                </div>
                <video id="cameraPreview" autoplay playsinline style="display:none; width:100%; max-width:320px; margin:10px auto;"></video>
                <button type="button" id="captureBtn" style="display:none; padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px;">Capture Photo</button>
                <canvas id="selfieCanvas" style="display:none;"></canvas>
                <div id="selfiePreview"></div>
            </div>

            <div id="faceMatchResult" style="display:none;" class="match-result">
                <div id="matchScore"></div>
                <div id="matchStatus"></div>
            </div>

            <button id="submitKYC" class="btn-primary">Submit for Verification</button>
        </div>
    </div>

    <div id="loadingOverlay" style="display:none;" class="loading-overlay">
        <div class="spinner"></div>
        <p style="color: white; margin-top: 20px;">Verifying your identity...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const zeusPin = urlParams.get('pin') || localStorage.getItem('temp_zeus_pin');
        const zeusPinDisplay = document.getElementById('zeusPinDisplay');
        zeusPinDisplay.textContent = zeusPin || 'Not available';

        let idImageData = null;
        let selfieImageData = null;
        let idImageElement = null;
        let selfieImageElement = null;
        let stream = null;
        let faceAPILoaded = false;

        async function loadFaceModels() {
            const loadingDiv = document.getElementById('loadingOverlay');
            if (loadingDiv) loadingDiv.style.display = 'flex';

            try {
                if (typeof faceapi === 'undefined') {
                    throw new Error('Face API library not loaded. Please check your internet connection.');
                }

                const modelPath = '/static/models';
                await Promise.race([
                    Promise.all([
                        faceapi.nets.tinyFaceDetector.loadFromUri(modelPath),
                        faceapi.nets.faceLandmark68Net.loadFromUri(modelPath),
                        faceapi.nets.faceRecognitionNet.loadFromUri(modelPath)
                    ]),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('Model loading timeout')), 30000))
                ]);

                faceAPILoaded = true;
                console.log('Face models loaded successfully');
                return true;
            } catch (error) {
                console.error('Failed to load face models:', error);
                const resultDiv = document.getElementById('faceMatchResult');
                if (resultDiv) {
                    resultDiv.style.display = 'block';
                    resultDiv.className = 'match-result failed';
                    document.getElementById('matchStatus').innerHTML = 'Face matching unavailable. Your KYC will be reviewed manually by admin.';
                    document.getElementById('matchScore').innerHTML = '';
                }
                return false;
            } finally {
                if (loadingDiv) loadingDiv.style.display = 'none';
            }
        }

        async function compareFacesSafe(idImageElement, selfieImageElement) {
            if (!faceAPILoaded || typeof faceapi === 'undefined') {
                return { score: null, error: 'Face API not available', fallback: true };
            }

            try {
                const idDetection = await faceapi.detectSingleFace(idImageElement, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptor();

                const selfieDetection = await faceapi.detectSingleFace(selfieImageElement, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptor();

                if (!idDetection || !selfieDetection) {
                    return { score: null, error: 'Face not detected in one or both images', fallback: true };
                }

                const distance = faceapi.euclideanDistance(idDetection.descriptor, selfieDetection.descriptor);
                const similarityScore = Math.max(0, Math.min(100, (1 - distance) * 100));
                return { score: similarityScore, error: null, fallback: false };
            } catch (error) {
                console.error('Face comparison error:', error);
                return { score: null, error: error.message, fallback: true };
            }
        }

        document.getElementById('idDocument').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) {
                alert('ID document must be 5MB or smaller.');
                e.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                if (file.type.startsWith('image/')) {
                    document.getElementById('idPreview').innerHTML = `<img src="${event.target.result}" class="preview-image">`;
                    idImageData = event.target.result;
                    idImageElement = new Image();
                    idImageElement.src = event.target.result;
                } else {
                    document.getElementById('idPreview').innerHTML = `<div>Document selected: ${file.name}</div>`;
                    idImageData = null;
                    idImageElement = null;
                }
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('openCameraBtn').addEventListener('click', async function() {
            const video = document.getElementById('cameraPreview');
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.style.display = 'block';
                document.getElementById('captureBtn').style.display = 'inline-block';
                this.style.display = 'none';
            } catch (_error) {
                alert('Camera access denied. Please upload a selfie photo instead.');
            }
        });

        document.getElementById('captureBtn').addEventListener('click', function() {
            const video = document.getElementById('cameraPreview');
            const canvas = document.getElementById('selfieCanvas');
            if (!video.videoWidth || !video.videoHeight) return;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            const selfieDataUrl = canvas.toDataURL('image/jpeg');
            document.getElementById('selfiePreview').innerHTML = `<img src="${selfieDataUrl}" class="preview-image">`;
            selfieImageData = selfieDataUrl;
            selfieImageElement = new Image();
            selfieImageElement.src = selfieDataUrl;

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
                video.style.display = 'none';
                this.style.display = 'none';
            }
        });

        document.getElementById('selfieUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('selfiePreview').innerHTML = `<img src="${event.target.result}" class="preview-image">`;
                selfieImageData = event.target.result;
                selfieImageElement = new Image();
                selfieImageElement.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('submitKYC').addEventListener('click', async function() {
            if (!zeusPin) {
                alert('Zeus PIN missing. Please restart registration.');
                return;
            }

            const idFile = document.getElementById('idDocument').files[0];
            if (!idFile || !selfieImageData) {
                alert('Please upload both ID document and selfie.');
                return;
            }

            const submitBtn = document.getElementById('submitKYC');
            const loadingDiv = document.getElementById('loadingOverlay');
            submitBtn.disabled = true;
            loadingDiv.style.display = 'flex';

            const modelsReady = await loadFaceModels();

            let faceScore = null;
            let autoVerified = false;
            if (idImageElement && selfieImageElement && modelsReady) {
                const result = await compareFacesSafe(idImageElement, selfieImageElement);
                if (result.score !== null) {
                    faceScore = result.score;
                    autoVerified = result.score >= 60;

                    const resultDiv = document.getElementById('faceMatchResult');
                    resultDiv.style.display = 'block';
                    document.getElementById('matchScore').innerHTML = `Face Match Score: ${faceScore.toFixed(1)}%`;
                    if (autoVerified) {
                        resultDiv.className = 'match-result passed';
                        document.getElementById('matchStatus').innerHTML = 'Auto-verified signal generated. Admin will still review.';
                    } else {
                        resultDiv.className = 'match-result failed';
                        document.getElementById('matchStatus').innerHTML = 'Manual review required.';
                    }
                } else if (result.fallback) {
                    const resultDiv = document.getElementById('faceMatchResult');
                    resultDiv.style.display = 'block';
                    resultDiv.className = 'match-result failed';
                    document.getElementById('matchScore').innerHTML = '';
                    document.getElementById('matchStatus').innerHTML = 'Face matching unavailable. Admin will review manually.';
                }
            }

            const formData = new FormData();
            formData.append('id_document', idFile);
            const selfieBlob = await fetch(selfieImageData).then(r => r.blob());
            formData.append('selfie', selfieBlob, 'selfie.jpg');
            formData.append('face_match_score', faceScore !== null ? String(faceScore) : '');
            formData.append('auto_verified', autoVerified ? '1' : '0');
            formData.append('document_type', document.querySelector('input[name="document_type"]:checked').value);
            formData.append('zeus_pin', zeusPin);

            try {
                const response = await fetch('/api/complete-kyc', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    localStorage.removeItem('temp_zeus_pin');
                    window.location.href = '/pending-approval';
                } else {
                    alert(data.error || 'Submission failed');
                }
            } catch (_error) {
                alert('Network error. Please try again.');
            } finally {
                loadingDiv.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
