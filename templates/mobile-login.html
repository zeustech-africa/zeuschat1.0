<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#D4AF37">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZeusChat">
  <title>Login — ZeusChat</title>
  <link rel="stylesheet" href="/static/mobile.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Georgia', -apple-system, BlinkMacSystemFont, 'Segoe UI', serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0d0d0d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { max-width: 420px; width: 100%; }
    .card {
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      padding: 40px 28px;
      border: 1px solid rgba(212,175,55,0.3);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8), 0 0 20px rgba(212,175,55,0.08);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo-icon { font-size: 38px; display: block; margin-bottom: 8px; }
    .logo h1 { font-size: 28px; color: #D4AF37; letter-spacing: 4px; font-weight: 700; }
    .logo-tagline { font-size: 11px; color: rgba(212,175,55,0.7); letter-spacing: 3px; margin-top: 4px; }
    .page-title {
      font-size: 12px; color: rgba(212,175,55,0.6); letter-spacing: 2px;
      text-align: center; margin-bottom: 24px; text-transform: uppercase;
    }
    .input-group { margin-bottom: 16px; }
    .input-group label {
      display: block; font-size: 11px; color: rgba(255,255,255,0.5);
      letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase;
    }
    .input-group input {
      width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(212,175,55,0.25); border-radius: 14px;
      color: #fff; font-size: 16px; outline: none; transition: border-color 0.2s;
    }
    .input-group input:focus { border-color: #D4AF37; }
    .btn {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, #D4AF37 0%, #B8960C 100%);
      color: #0a0a0a; border: none; border-radius: 40px; font-size: 16px;
      font-weight: 700; cursor: pointer; letter-spacing: 1px; text-transform: uppercase;
      transition: all 0.3s; margin-bottom: 16px; margin-top: 8px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(212,175,55,0.4); }
    .secondary-link {
      display: block; text-align: center; color: rgba(212,175,55,0.6);
      font-size: 13px; margin-top: 8px; text-decoration: none; cursor: pointer;
    }
    .secondary-link:hover { color: #D4AF37; }
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: rgba(212,175,55,0.3); font-size: 12px;
    }
    .divider-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #D4AF37, transparent); }
    .floating-ghost {
      position: fixed; font-size: 22px; opacity: 0.08;
      animation: ghostFloat 6s ease-in-out infinite; pointer-events: none; z-index: 0;
    }
    @keyframes ghostFloat {
      0%, 100% { transform: translateY(0px) rotate(-5deg); }
      50% { transform: translateY(-18px) rotate(5deg); }
    }
    #csrf-token { display: none; }
  </style>
</head>
<body>
  <div class="floating-ghost" style="top:8%;left:6%;">👻</div>
  <div class="floating-ghost" style="bottom:12%;right:7%;animation-delay:2s;">👻</div>
  <div class="floating-ghost" style="top:55%;left:3%;animation-delay:4s;">🕯️</div>

  <div class="container">
    <div class="card">
      <div class="logo">
        <span class="logo-icon">🛡️</span>
        <h1>ZEUSCHAT</h1>
        <div class="logo-tagline">GHOST MODE MESSAGING</div>
      </div>

      <div class="page-title">Sign In To Your Account</div>

      <input type="hidden" id="csrf-token">

      <div class="input-group">
        <label>Zeus-PIN</label>
        <input type="text" id="zeus-pin" placeholder="e.g. ZT-1234-5678" autocomplete="username" autocapitalize="none">
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
      </div>

      <button class="btn" onclick="login()">Log In →</button>

      <div class="divider">
        <div class="divider-line"></div>
        <span>✦</span>
        <div class="divider-line"></div>
      </div>

      <a class="secondary-link" href="/mobile/email">Don't have an account? Get Started →</a>
      <a class="secondary-link" href="/mobile" style="margin-top:6px;font-size:12px;color:rgba(255,255,255,0.25);">← Back to Welcome</a>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let csrfToken = null;

    async function ensureCsrfToken() {
      if (csrfToken) return csrfToken;
      try {
        const response = await fetch(`${API_BASE}/api/csrf-token`, { method: 'GET', credentials: 'include' });
        const data = await response.json();
        csrfToken = data.csrf_token || null;
        const tokenInput = document.getElementById('csrf-token');
        if (tokenInput && csrfToken) tokenInput.value = csrfToken;
      } catch {}
      return csrfToken;
    }

    async function apiFetch(url, options = {}) {
      const opts = { ...options };
      const method = (opts.method || 'GET').toUpperCase();
      opts.method = method;
      opts.credentials = opts.credentials || 'include';
      opts.headers = { ...(opts.headers || {}) };
      if (!['GET', 'HEAD', 'OPTIONS'].includes(method)) {
        const token = await ensureCsrfToken();
        if (token) opts.headers['X-CSRF-Token'] = token;
      }
      return fetch(url, opts);
    }

    window.addEventListener('DOMContentLoaded', () => { ensureCsrfToken().catch(() => {}); });

    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') login();
    });

    async function login() {
      const zeusPIN = document.getElementById('zeus-pin').value.trim();
      const password = document.getElementById('password').value;

      if (!zeusPIN || !password) {
        alert('Please enter your Zeus-PIN and password.');
        return;
      }

      try {
        const response = await apiFetch(`${API_BASE}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ zeus_pin: zeusPIN, password })
        });

        const result = await response.json();

        if (response.ok && result.success && result.user) {
          sessionStorage.setItem('user_zeus_pin', result.user.zeus_pin);
          sessionStorage.setItem('user_full_name', result.user.full_name || '');
          sessionStorage.setItem('user_profile_pic', result.user.profile_pic || '');
          sessionStorage.setItem('user_id', result.user.id);
          sessionStorage.setItem('user_logged_in', 'true');
          sessionStorage.setItem('user_password', password);

          if (result.approved === true) {
            window.location.href = '/mobile/chat';
          } else if (result.approved === false) {
            window.location.href = '/mobile/pending';
          } else {
            window.location.href = '/mobile/pending';
          }
        } else {
          alert(result.error || 'Login failed. Please check your PIN and password.');
        }
      } catch {
        alert('Network error. Please try again.');
      }
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
