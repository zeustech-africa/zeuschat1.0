<!DOCTYPE html>
<html>
<head>
    <title>ZeusChat - Test Login</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667781 0%, #1A1A1A 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .login-box {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            margin: 0 0 10px 0;
            color: #111111;
        }
        .subtitle {
            color: #667781;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            margin: 10px 0;
            border: 1px solid #E4E6EB;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #34B7F1;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #2A9FD6;
        }
        .error {
            color: #F44336;
            margin-top: 15px;
            text-align: center;
        }
        .success {
            color: #4CAF50;
            margin-top: 15px;
            text-align: center;
        }
        .info {
            background: #F5F6F8;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>ZeusChat Admin</h1>
        <div class="subtitle">Login to Control Room</div>
        
        <form id="login-form">
            <input type="text" id="zeus_pin" placeholder="ZeusPIN" value="superadmin">
            <input type="password" id="password" placeholder="Password" value="admin123">
            <button type="submit">Login</button>
        </form>
        
        <div id="message"></div>
        
        <div class="info">
            <strong>Test Credentials:</strong><br>
            ZeusPIN: superadmin<br>
            Password: admin123<br>
            <br>
            <strong>Admin Control Room:</strong><br>
            After login, go to: <a href="/admin_control">/admin_control</a>
        </div>
    </div>
    
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const zeus_pin = document.getElementById('zeus_pin').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            messageDiv.innerHTML = '<div class="info">Logging in...</div>';
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ zeus_pin, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    messageDiv.innerHTML = '<div class="success">✅ Login successful! Redirecting...</div>';
                    setTimeout(() => {
                        window.location.href = '/admin_control';
                    }, 1000);
                } else {
                    messageDiv.innerHTML = '<div class="error">❌ Login failed: ' + (data.error || 'Invalid credentials') + '</div>';
                }
            } catch (error) {
                messageDiv.innerHTML = '<div class="error">❌ Connection error: ' + error.message + '</div>';
            }
        });
    </script>
</body>
</html>
