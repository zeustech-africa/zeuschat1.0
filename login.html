<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZeusChat">
  <link rel="apple-touch-icon" href="/zeuschat-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/zeuschat-icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/zeuschat-icon.png">
  <title>Login — ZeusChat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #000;
      overflow: hidden;
      height: 100vh;
      color: #fff;
    }
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 0;
    }
    .header {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .logo {
      height: 32px;
      margin-bottom: 4px;
    }
    .byline {
      font-size: 12px;
      color: #FFD700;
      font-weight: 500;
    }
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .box {
      background: #222;
      border-radius: 12px;
      padding: 24px;
      margin: 16px 0;
      width: 100%;
      max-width: 600px;
      text-align: left;
    }
    .box-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #fff;
    }
    .input-group {
      margin-bottom: 16px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: #333;
      border: 1px solid #444;
      color: #fff;
      border-radius: 6px;
    }
    .btn {
      background: #FFD700;
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 16px;
      width: 100%;
      max-width: 400px;
    }
    .link {
      color: #FFD700;
      text-decoration: underline;
      margin-top: 16px;
      font-size: 14px;
    }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #aaa;
      text-align: center;
    }

/* Mobile Responsive Styles */
@media (max-width: 768px) {
    body {
        padding: 16px;
    }

    .container, .card, .main-content {
        padding: 20px 16px;
        margin: 0;
        width: 100%;
        border-radius: 24px;
    }

    h1 {
        font-size: 28px;
    }

    h2 {
        font-size: 22px;
    }

    button, .btn-primary, .btn-secondary {
        padding: 14px 20px;
        font-size: 16px;
    }

    input, textarea, select {
        padding: 14px;
        font-size: 16px;
    }

    .sidebar {
        position: fixed;
        left: -280px;
        transition: left 0.3s;
        z-index: 1000;
    }

    .sidebar.open {
        left: 0;
    }

    .menu-toggle {
        display: block;
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 1001;
        background: #D4AF37;
        border: none;
        border-radius: 8px;
        padding: 10px;
        cursor: pointer;
    }

    .main-content {
        margin-left: 0;
        padding: 60px 16px 20px;
    }

    .admin-table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
    }

    .feature-grid, .pricing-grid {
        grid-template-columns: 1fr;
    }

    .chat-container {
        flex-direction: column;
    }

    .message {
        max-width: 85%;
    }

    body {
        font-size: 14px;
    }

    button, a, .clickable {
        min-height: 44px;
    }
}
  </style>
  <link rel="stylesheet" href="/static/mobile.css">
</head>
<body>
  <video class="video-bg" autoplay muted loop poster="/static/videos/zeustech-background.jpg">
    <source src="/static/videos/zeustech-background.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <div class="overlay"></div>

  <!-- Top-left: Logo + Byline -->
  <div class="header">
    <img src="zeustech-logo-zeushchat.png" class="logo" alt="ZeusTech">
    <div class="byline">ZeusChat by ZeusTech</div>
  </div>

  <div class="container">
    <!-- Box: Login -->
    <div class="box">
      <div class="box-title">Log In to Existing Account</div>
      <input type="hidden" id="csrf-token" name="csrf_token" value="">
      <div class="input-group">
        <input type="text" id="zeus-pin" placeholder="Zeus-PIN (e.g. ZT-1234-5678)" />
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="Password" />
      </div>
      <button class="btn" onclick="login()">Log In</button>
      <a href="index.html" class="link">← Back to Welcome</a>
    </div>

    <!-- Footer -->
    <div class="footer">
      Don't have an account? <a href="index.html" class="link">Get started</a><br>
      Your messages self-destruct after viewing — CIA-grade privacy<br>
      Terms & Privacy Policy
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin; // Automatically uses current domain
    let csrfToken = null;

    async function ensureCsrfToken(forceRefresh = false) {
      if (csrfToken && !forceRefresh) {
        return csrfToken;
      }

      const response = await window.fetch(`${API_BASE}/api/csrf-token`, {
        method: 'GET',
        credentials: 'include'
      });
      const data = await response.json();
      csrfToken = data.csrf_token || null;

      const tokenInput = document.getElementById('csrf-token');
      if (tokenInput && csrfToken) {
        tokenInput.value = csrfToken;
      }

      return csrfToken;
    }

    async function apiFetch(url, options = {}) {
      const requestOptions = { ...options };
      const method = (requestOptions.method || 'GET').toUpperCase();
      requestOptions.method = method;
      requestOptions.credentials = requestOptions.credentials || 'include';
      requestOptions.headers = { ...(requestOptions.headers || {}) };

      if (!['GET', 'HEAD', 'OPTIONS'].includes(method)) {
        const token = await ensureCsrfToken();
        if (token) {
          requestOptions.headers['X-CSRF-Token'] = token;
        }
      }

      return window.fetch(url, requestOptions);
    }

    window.addEventListener('DOMContentLoaded', () => {
      ensureCsrfToken().catch((error) => {
        console.error('Failed to initialize CSRF token:', error);
      });
    });

    async function login() {
      const zeusPIN = document.getElementById('zeus-pin').value.trim();
      const password = document.getElementById('password').value;

      if (!zeusPIN || !password) {
        alert("Please enter Zeus-PIN and password.");
        return;
      }

      try {
        console.log('=== LOGIN PROCESS ===');
        console.log('1. User submitted credentials');
        
        // Call backend /api/login
        const response = await apiFetch(`${API_BASE}/api/login`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ zeus_pin: zeusPIN, password: password })
        });

        console.log('2. API response status:', response.status);
        const result = await response.json();
        console.log('3. API response data:', result);

        if (response.ok && result.success && result.user) {
          console.log('4. Setting session data...');
          
          // Save session data
          sessionStorage.setItem('user_zeus_pin', result.user.zeus_pin);
          sessionStorage.setItem('user_full_name', result.user.full_name || '');
          sessionStorage.setItem('user_profile_pic', result.user.profile_pic || '');
          sessionStorage.setItem('user_id', result.user.id);
          sessionStorage.setItem('user_logged_in', 'true');
          sessionStorage.setItem('user_password', password);  // Store for PIN-to-view verification

          console.log('5. Session data verified:', {
            loggedIn: sessionStorage.getItem('user_logged_in'),
            pin: sessionStorage.getItem('user_zeus_pin')
          });

          // Clear return URL to prevent loops
          sessionStorage.removeItem('return_url');

          if (result.approved === true) {
            console.log('6. Approved user, redirecting to /dashboard...');
            alert('✅ Welcome back! Your chats, contacts, and settings are restored.');
            window.location.href = '/dashboard';
          } else if (result.approved === false) {
            console.log('6. Account pending approval, redirecting to /pending-approval...');
            alert('⏳ Your account is pending admin approval.');
            window.location.href = '/pending-approval';
          } else {
            console.log('6. Approval flag missing, using safe fallback redirect to /pending-approval...');
            window.location.href = '/pending-approval';
          }
        } else {
          alert(result.error || 'Login failed');
        }
      } catch (error) {
        console.error('Login error:', error);
        alert('Network error. Please try again.');
      }
    }
  </script>

  <script>
  // Register Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/static/sw.js')
        .then(registration => {
          console.log('SW registered:', registration.scope);
        })
        .catch(error => {
          console.log('SW registration failed:', error);
        });
    });
  }
  </script>
</body>
</html>
