<!-- pending.html: Pending Approval Page with Chat UI and 4K Background Video -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pending Approval — ZeusChat</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #000; color: #fff; }
    .video-background { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -2; }
    .content-overlay { position: relative; z-index: 1; background: rgba(0,0,0,0.5); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .pending-chat-container { max-width: 420px; width: 100%; background: rgba(0,0,0,0.7); border-radius: 18px; padding: 32px 24px; margin: 40px auto; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
    .admin-info { margin-bottom: 18px; text-align: center; }
    .chat-messages { max-height: 220px; overflow-y: auto; background: rgba(255,255,255,0.06); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .message { margin-bottom: 8px; }
    .message.user { color: #FFD700; }
    .message.admin { color: #fff; font-style: italic; }
    .message.system { color: #aaa; font-size: 13px; }
    .chat-input-area { display: flex; gap: 8px; }
    .message-input { flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 15px; }
    .send-btn, .attach-btn, .emoji-btn { background: #FFD700; border: none; border-radius: 8px; padding: 0 14px; font-size: 18px; cursor: pointer; }
    .file-preview { margin-top: 8px; color: #FFD700; }
  </style>
</head>
<body>

  <div class="content-overlay">
    <div class="pending-chat-container">
      <div class="admin-info">
        <h3>📬 Admin Communication</h3>
        <p>Your account is pending approval. You can message the admin here.</p>
      </div>
      <div class="chat-messages" id="pending-chat-messages">
        <div class="message system"><span>🤖 Your verification is pending. Admin may contact you here.</span></div>
      </div>
      <div class="chat-input-area">
        <button class="attach-btn" onclick="openPendingAttachment()">📎</button>
        <input type="text" id="pending-message-input" placeholder="Type a message to admin..." class="message-input">
        <button class="emoji-btn" onclick="togglePendingEmoji()">😊</button>
        <button class="send-btn" onclick="sendPendingMessage()">📤</button>
      </div>
      <div class="file-preview" id="file-preview" style="display:none;"></div>
    </div>
  </div>
  <script>
    function sendPendingMessage() {
      var input = document.getElementById("pending-message-input");
      var message = input.value.trim();
      if (message) {
        addPendingMessage("You", message, "user");
        fetch("/api/pending/message", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({message: message, type: "text"})
        });
        input.value = "";
      }
    }
    function addPendingMessage(sender, text, type) {
      var container = document.getElementById("pending-chat-messages");
      var messageDiv = document.createElement("div");
      messageDiv.className = "message " + type;
      messageDiv.innerHTML = "<strong>" + sender + ":</strong> " + text;
      container.appendChild(messageDiv);
      container.scrollTop = container.scrollHeight;
    }
    function openPendingAttachment() {
      var input = document.createElement("input");
      input.type = "file";
      input.onchange = function(e) {
        var file = e.target.files[0];
        if (file) {
          var preview = document.getElementById("file-preview");
          preview.innerHTML = "<div>📎 " + file.name + " <button onclick=\"sendFile()\">Send</button></div>";
          preview.style.display = "block";
          window.pendingFile = file;
        }
      };
      input.click();
    }
    function sendFile() {
      if (window.pendingFile) {
        var formData = new FormData();
        formData.append("file", window.pendingFile);
        fetch("/api/pending/upload", {method: "POST", body: formData});
        addPendingMessage("You", "📎 Sent: " + window.pendingFile.name, "user");
        document.getElementById("file-preview").style.display = "none";
        window.pendingFile = null;
      }
    }
    function loadPendingMessages() {
      fetch("/api/pending/messages")
        .then(res => res.json())
        .then(data => {
          if (data.messages) {
            document.getElementById("pending-chat-messages").innerHTML = '';
            data.messages.forEach(msg => {
              addPendingMessage(msg.sender, msg.text, msg.type);
            });
          }
        });
    }
    setInterval(loadPendingMessages, 5000);
    loadPendingMessages();
  </script>
</body>
</html>
