<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#D4AF37">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZeusChat">
  <title>Verify Code — ZeusChat</title>
  <link rel="stylesheet" href="/static/mobile.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Georgia', -apple-system, BlinkMacSystemFont, 'Segoe UI', serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0d0d0d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { max-width: 420px; width: 100%; }
    .card {
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      padding: 40px 28px;
      border: 1px solid rgba(212,175,55,0.3);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8), 0 0 20px rgba(212,175,55,0.08);
    }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo-icon { font-size: 38px; display: block; margin-bottom: 8px; }
    .logo h1 { font-size: 28px; color: #D4AF37; letter-spacing: 4px; font-weight: 700; }
    .logo-tagline { font-size: 11px; color: rgba(212,175,55,0.7); letter-spacing: 3px; margin-top: 4px; }
    .step-label {
      font-size: 12px; color: rgba(212,175,55,0.6); letter-spacing: 2px;
      text-align: center; margin-bottom: 20px; text-transform: uppercase;
    }
    .subtitle { font-size: 14px; color: rgba(255,255,255,0.6); text-align: center; margin-bottom: 24px; line-height: 1.5; }
    .input-group { margin-bottom: 20px; }
    .input-group label {
      display: block; font-size: 11px; color: rgba(255,255,255,0.5);
      letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase;
    }
    .input-group input {
      width: 100%; padding: 16px; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(212,175,55,0.25); border-radius: 16px;
      color: #fff; font-size: 26px; font-weight: 700;
      letter-spacing: 10px; text-align: center; outline: none; transition: border-color 0.2s;
    }
    .input-group input:focus { border-color: #D4AF37; }
    .btn {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, #D4AF37 0%, #B8960C 100%);
      color: #0a0a0a; border: none; border-radius: 40px; font-size: 16px;
      font-weight: 700; cursor: pointer; letter-spacing: 1px; text-transform: uppercase;
      transition: all 0.3s; margin-bottom: 16px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(212,175,55,0.4); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error-msg {
      background: rgba(255,50,50,0.1); border: 1px solid rgba(255,50,50,0.3);
      color: #ff6b6b; border-radius: 12px; padding: 12px; font-size: 13px;
      text-align: center; margin-bottom: 16px; display: none;
    }
    .note {
      background: rgba(212,175,55,0.06); border: 1px solid rgba(212,175,55,0.15);
      border-radius: 12px; padding: 14px; font-size: 12px; color: rgba(255,255,255,0.5);
      line-height: 1.6; text-align: center;
    }
    .back-link {
      display: block; text-align: center; color: rgba(212,175,55,0.5);
      font-size: 13px; margin-top: 16px; text-decoration: none; cursor: pointer;
    }
    .back-link:hover { color: #D4AF37; }
    .floating-ghost {
      position: fixed; font-size: 22px; opacity: 0.08;
      animation: ghostFloat 6s ease-in-out infinite; pointer-events: none; z-index: 0;
    }
    @keyframes ghostFloat {
      0%, 100% { transform: translateY(0px) rotate(-5deg); }
      50% { transform: translateY(-18px) rotate(5deg); }
    }
  </style>
</head>
<body>
  <div class="floating-ghost" style="top:8%;left:6%;">👻</div>
  <div class="floating-ghost" style="bottom:12%;right:7%;animation-delay:2s;">👻</div>
  <div class="floating-ghost" style="top:55%;left:3%;animation-delay:4s;">🕯️</div>

  <div class="container">
    <div class="card">
      <div class="logo">
        <span class="logo-icon">🛡️</span>
        <h1>ZEUSCHAT</h1>
        <div class="logo-tagline">VERIFY YOUR IDENTITY</div>
      </div>

      <div class="step-label">Step 2 of 4 — Verify Code</div>
      <div class="subtitle">Enter the 6-digit code sent to <span id="emailDisplay" style="color:#D4AF37;"></span></div>

      <div class="input-group">
        <label>Verification Code</label>
        <input type="text" id="otp" placeholder="000000" maxlength="6" autocomplete="one-time-code" inputmode="numeric">
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <button class="btn" id="verifyBtn" onclick="verifyOTP()">Verify &amp; Continue →</button>

      <div class="note">
        <strong style="color:#D4AF37;">Test Mode Active:</strong><br>
        Default code: <strong>123456</strong>
      </div>

      <a class="back-link" href="/mobile/email">← Change Email</a>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    const pendingEmail = localStorage.getItem('pending_email');
    if (!pendingEmail) {
      window.location.href = '/mobile/email';
    } else {
      document.getElementById('emailDisplay').textContent = pendingEmail;
      document.getElementById('otp').value = '123456';
    }

    document.getElementById('otp').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') verifyOTP();
    });

    async function verifyOTP() {
      const otpInput = document.getElementById('otp');
      const verifyBtn = document.getElementById('verifyBtn');
      const errorMsg = document.getElementById('errorMsg');

      if (verifyBtn.disabled) return;
      verifyBtn.disabled = true;
      verifyBtn.textContent = 'Verifying...';
      errorMsg.style.display = 'none';

      const email = localStorage.getItem('pending_email');
      const otp = otpInput.value.trim();

      if (!otp || otp.length !== 6 || !/^\d+$/.test(otp)) {
        errorMsg.textContent = 'Please enter a valid 6-digit code.';
        errorMsg.style.display = 'block';
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'Verify & Continue →';
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/verify-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, otp })
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'OTP verification failed');
        if (!result.zeus_pin) throw new Error('Invalid response: no zeus_pin generated');

        localStorage.setItem('registration_email', email);
        localStorage.setItem('my_zeus_pin', result.zeus_pin);
        localStorage.removeItem('pending_email');

        window.location.href = '/mobile/profile-create';
      } catch (error) {
        errorMsg.textContent = error.message || 'Verification failed. Please try again.';
        errorMsg.style.display = 'block';
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'Verify & Continue →';
      }
    }
  </script>
</body>
</html>
