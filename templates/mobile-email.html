<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#D4AF37">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZeusChat">
  <title>Enter Email — ZeusChat</title>
  <link rel="stylesheet" href="/static/mobile.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Georgia', -apple-system, BlinkMacSystemFont, 'Segoe UI', serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0d0d0d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { max-width: 420px; width: 100%; }
    .card {
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      padding: 40px 28px;
      border: 1px solid rgba(212,175,55,0.3);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8), 0 0 20px rgba(212,175,55,0.08);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo-icon { font-size: 38px; display: block; margin-bottom: 8px; }
    .logo h1 { font-size: 28px; color: #D4AF37; letter-spacing: 4px; font-weight: 700; }
    .logo-tagline { font-size: 11px; color: rgba(212,175,55,0.7); letter-spacing: 3px; margin-top: 4px; }
    .step-label {
      font-size: 12px; color: rgba(212,175,55,0.6); letter-spacing: 2px;
      text-align: center; margin-bottom: 20px; text-transform: uppercase;
    }
    .input-group { margin-bottom: 20px; }
    .input-group label {
      display: block; font-size: 11px; color: rgba(255,255,255,0.5);
      letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase;
    }
    .input-group input {
      width: 100%; padding: 16px; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(212,175,55,0.25); border-radius: 16px;
      color: #fff; font-size: 16px; outline: none; transition: border-color 0.2s;
    }
    .input-group input:focus { border-color: #D4AF37; }
    .btn {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, #D4AF37 0%, #B8960C 100%);
      color: #0a0a0a; border: none; border-radius: 40px; font-size: 16px;
      font-weight: 700; cursor: pointer; letter-spacing: 1px; text-transform: uppercase;
      transition: all 0.3s; margin-bottom: 16px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(212,175,55,0.4); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .note {
      background: rgba(212,175,55,0.06); border: 1px solid rgba(212,175,55,0.15);
      border-radius: 12px; padding: 14px; font-size: 12px; color: rgba(255,255,255,0.5);
      line-height: 1.6; text-align: center;
    }
    .back-link {
      display: block; text-align: center; color: rgba(212,175,55,0.5);
      font-size: 13px; margin-top: 16px; text-decoration: none; cursor: pointer;
    }
    .back-link:hover { color: #D4AF37; }
    .floating-ghost {
      position: fixed; font-size: 22px; opacity: 0.08;
      animation: ghostFloat 6s ease-in-out infinite; pointer-events: none; z-index: 0;
    }
    @keyframes ghostFloat {
      0%, 100% { transform: translateY(0px) rotate(-5deg); }
      50% { transform: translateY(-18px) rotate(5deg); }
    }
  </style>
</head>
<body>
  <div class="floating-ghost" style="top:8%;left:6%;">👻</div>
  <div class="floating-ghost" style="bottom:12%;right:7%;animation-delay:2s;">👻</div>
  <div class="floating-ghost" style="top:55%;left:3%;animation-delay:4s;">🕯️</div>

  <div class="container">
    <div class="card">
      <div class="logo">
        <span class="logo-icon">🛡️</span>
        <h1>ZEUSCHAT</h1>
        <div class="logo-tagline">GHOST MODE MESSAGING</div>
      </div>

      <div class="step-label">Step 1 of 4 — Enter Email</div>

      <div class="input-group">
        <label>Your Email Address</label>
        <input type="email" id="email" placeholder="you@email.com" autocomplete="email" inputmode="email">
      </div>

      <button class="btn" id="nextBtn" onclick="saveEmail()">Continue →</button>

      <div class="note">
        <strong style="color:#D4AF37;">Test Mode Active:</strong><br>
        Enter any email → Use code <strong>123456</strong><br>
        You'll get a unique Zeus-PIN for secure messaging.
      </div>

      <a class="back-link" onclick="history.back()">← Back</a>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    document.getElementById('email').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') saveEmail();
    });

    function saveEmail() {
      const emailInput = document.getElementById('email');
      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn.disabled) return;

      nextBtn.disabled = true;
      nextBtn.textContent = 'Processing...';

      const email = emailInput.value.trim().toLowerCase();

      if (!email) {
        alert('Please enter your email.');
        nextBtn.disabled = false;
        nextBtn.textContent = 'Continue →';
        return;
      }

      const emailRegex = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$/;
      if (!emailRegex.test(email)) {
        alert('Please enter a valid email address.');
        nextBtn.disabled = false;
        nextBtn.textContent = 'Continue →';
        return;
      }

      fetch(`${API_BASE}/api/start-signup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          localStorage.setItem('pending_email', email);
          window.location.href = '/mobile/otp';
        } else {
          alert(data.error || 'Failed to send OTP. Please try again.');
          nextBtn.disabled = false;
          nextBtn.textContent = 'Continue →';
        }
      })
      .catch(() => {
        alert('Network error. Please check your connection.');
        nextBtn.disabled = false;
        nextBtn.textContent = 'Continue →';
      });
    }
  </script>
</body>
</html>
