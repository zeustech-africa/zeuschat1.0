services:
  - type: web
    name: zeuschat
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT app:app --timeout 120
    envVars:
      - key: RENDER
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/zeuschat.db
      - key: PAYFAST_TEST_MODE
        value: "true"
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
