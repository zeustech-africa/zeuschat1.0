<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Emoji Picker Test</title>
  <style>
    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: system-ui;
      padding: 20px;
    }
    
    .test-container {
      max-width: 600px;
      margin: 0 auto;
      background: rgba(20, 20, 20, 0.9);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }
    
    h1 {
      color: #d4af37;
      margin-bottom: 20px;
    }
    
    .test-section {
      margin-bottom: 30px;
      padding: 15px;
      background: rgba(30, 30, 30, 0.7);
      border-radius: 8px;
    }
    
    .test-label {
      color: #d4af37;
      font-weight: 600;
      margin-bottom: 10px;
    }
    
    #message-input {
      width: 100%;
      padding: 10px;
      background: rgba(40, 40, 40, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #f0f0f0;
      border-radius: 6px;
      font-size: 14px;
    }
    
    #emoji-toggle {
      font-size: 24px;
      cursor: pointer;
      padding: 10px;
      margin-right: 10px;
    }
    
    #emoji-toggle:hover {
      background: rgba(212, 175, 55, 0.2);
      border-radius: 6px;
    }
    
    /* Emoji Picker */
    .emoji-picker {
      position: absolute;
      top: 200px;
      left: 20px;
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
      padding: 12px;
      display: none;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      z-index: 100;
      max-width: 360px;
      max-height: 500px;
      overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    
    .emoji-picker.visible {
      display: grid;
    }
    
    .emoji-category-title {
      font-size: 13px;
      color: #d4af37;
      margin-bottom: 6px;
      margin-top: 8px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.8;
      grid-column: 1 / -1;
    }
    
    .emoji {
      font-size: 24px;
      cursor: pointer;
      padding: 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      transition: all 0.15s ease;
    }
    
    .emoji:hover {
      background: rgba(212, 175, 55, 0.15);
      transform: scale(1.2);
    }
    
    .status {
      margin-top: 20px;
      padding: 10px;
      background: rgba(212, 175, 55, 0.1);
      border-left: 3px solid #d4af37;
      border-radius: 4px;
      font-size: 13px;
    }
    
    .status.success {
      color: #4ade80;
      border-left-color: #4ade80;
      background: rgba(74, 222, 128, 0.1);
    }
    
    .status.error {
      color: #ef4444;
      border-left-color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }

/* Mobile Responsive Styles */
@media (max-width: 768px) {
    body {
        padding: 16px;
    }

    .container, .card, .main-content {
        padding: 20px 16px;
        margin: 0;
        width: 100%;
        border-radius: 24px;
    }

    h1 {
        font-size: 28px;
    }

    h2 {
        font-size: 22px;
    }

    button, .btn-primary, .btn-secondary {
        padding: 14px 20px;
        font-size: 16px;
    }

    input, textarea, select {
        padding: 14px;
        font-size: 16px;
    }

    .sidebar {
        position: fixed;
        left: -280px;
        transition: left 0.3s;
        z-index: 1000;
    }

    .sidebar.open {
        left: 0;
    }

    .menu-toggle {
        display: block;
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 1001;
        background: #D4AF37;
        border: none;
        border-radius: 8px;
        padding: 10px;
        cursor: pointer;
    }

    .main-content {
        margin-left: 0;
        padding: 60px 16px 20px;
    }

    .admin-table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
    }

    .feature-grid, .pricing-grid {
        grid-template-columns: 1fr;
    }

    .chat-container {
        flex-direction: column;
    }

    .message {
        max-width: 85%;
    }

    body {
        font-size: 14px;
    }

    button, a, .clickable {
        min-height: 44px;
    }
}
  </style>
  <link rel="stylesheet" href="/static/mobile.css">
</head>
<body>
  <div class="test-container">
    <h1>🧪 Emoji Picker Test</h1>
    
    <div class="test-section">
      <div class="test-label">Test 1: Click the emoji icon to toggle the picker</div>
      <div style="display: flex; align-items: center;">
        <span id="emoji-toggle" onclick="toggleEmojiPicker()" title="Click to open/close emoji picker">😊</span>
        <span id="toggle-status" style="color: #999; font-size: 12px;"></span>
      </div>
    </div>
    
    <div class="test-section">
      <div class="test-label">Test 2: Message Input (select an emoji)</div>
      <input id="message-input" type="text" placeholder="Click an emoji to insert it here...">
    </div>
    
    <div id="status-message"></div>
  </div>
  
  <!-- Emoji Picker -->
  <div class="emoji-picker" id="emoji-picker">
    <!-- SMILEYS & EMOTION -->
    <div class="emoji-category-title">Smileys</div>
    <div class="emoji" onclick="insertEmoji('😀')">😀</div>
    <div class="emoji" onclick="insertEmoji('😃')">😃</div>
    <div class="emoji" onclick="insertEmoji('😄')">😄</div>
    <div class="emoji" onclick="insertEmoji('😁')">😁</div>
    <div class="emoji" onclick="insertEmoji('😆')">😆</div>
    <div class="emoji" onclick="insertEmoji('😅')">😅</div>
    <div class="emoji" onclick="insertEmoji('🤣')">🤣</div>
    <div class="emoji" onclick="insertEmoji('😂')">😂</div>
    <div class="emoji" onclick="insertEmoji('🙂')">🙂</div>
    <div class="emoji" onclick="insertEmoji('🙃')">🙃</div>
    <div class="emoji" onclick="insertEmoji('😉')">😉</div>
    <div class="emoji" onclick="insertEmoji('😊')">😊</div>
    <div class="emoji" onclick="insertEmoji('😇')">😇</div>
    <div class="emoji" onclick="insertEmoji('🥰')">🥰</div>
    <div class="emoji" onclick="insertEmoji('😍')">😍</div>
    
    <!-- HAND GESTURES -->
    <div class="emoji-category-title">Gestures</div>
    <div class="emoji" onclick="insertEmoji('👋')">👋</div>
    <div class="emoji" onclick="insertEmoji('🤚')">🤚</div>
    <div class="emoji" onclick="insertEmoji('🖐️')">🖐️</div>
    <div class="emoji" onclick="insertEmoji('✋')">✋</div>
    <div class="emoji" onclick="insertEmoji('🖖')">🖖</div>
    <div class="emoji" onclick="insertEmoji('👌')">👌</div>
    <div class="emoji" onclick="insertEmoji('🤌')">🤌</div>
    <div class="emoji" onclick="insertEmoji('🤏')">🤏</div>
    <div class="emoji" onclick="insertEmoji('✌️')">✌️</div>
    <div class="emoji" onclick="insertEmoji('🤞')">🤞</div>
    <div class="emoji" onclick="insertEmoji('🫰')">🫰</div>
    <div class="emoji" onclick="insertEmoji('🤟')">🤟</div>
    <div class="emoji" onclick="insertEmoji('🤘')">🤘</div>
    <div class="emoji" onclick="insertEmoji('🤙')">🤙</div>
    <div class="emoji" onclick="insertEmoji('👍')">👍</div>
  </div>
  
  <script>
    // Log when page loads
    console.log('✅ Emoji Test Page Loaded');
    
    function toggleEmojiPicker() {
      const picker = document.getElementById('emoji-picker');
      const toggle = document.getElementById('emoji-toggle');
      const statusSpan = document.getElementById('toggle-status');
      
      picker.classList.toggle('visible');
      const isVisible = picker.classList.contains('visible');
      
      console.log('✅ Emoji picker toggled - visible:', isVisible);
      statusSpan.textContent = isVisible ? ' (Open)' : ' (Closed)';
      
      // Log the computed style to verify
      const computedStyle = window.getComputedStyle(picker).display;
      console.log('Display property:', computedStyle);
      
      updateStatus('✅ Emoji picker toggled successfully', 'success');
    }
    
    function insertEmoji(emoji) {
      const input = document.getElementById('message-input');
      input.value += emoji;
      input.focus();
      console.log('✅ Emoji inserted:', emoji);
      updateStatus(`✅ "${emoji}" inserted into message`, 'success');
    }
    
    function updateStatus(message, type = 'success') {
      const statusDiv = document.getElementById('status-message');
      statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
    }
    
    // Test logging
    console.log('✅ All functions initialized');
    console.log('  • toggleEmojiPicker: ready');
    console.log('  • insertEmoji: ready');
    
    // Verify elements exist
    const picker = document.getElementById('emoji-picker');
    const input = document.getElementById('message-input');
    const toggle = document.getElementById('emoji-toggle');
    
    console.log('✅ DOM Elements Check:');
    console.log('  • emoji-picker:', picker ? 'FOUND' : 'MISSING');
    console.log('  • message-input:', input ? 'FOUND' : 'MISSING');
    console.log('  • emoji-toggle:', toggle ? 'FOUND' : 'MISSING');
    
    // Check initial picker visibility
    const pickerDisplay = window.getComputedStyle(picker).display;
    const pickerHasVisible = picker.classList.contains('visible');
    console.log('✅ Initial Picker State:');
    console.log('  • Display property:', pickerDisplay);
    console.log('  • Has .visible class:', pickerHasVisible);
    console.log('  • Expected: display=none, class=false');
    
    updateStatus('✅ All tests loaded. Click the emoji icon to begin!', 'success');
  </script>
</body>
</html>
