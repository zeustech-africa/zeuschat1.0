<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #1a1a1a; color: white; }
        .container { max-width: 800px; margin: 0 auto; background: #2a2a2a; padding: 20px; border-radius: 10px; }
        h1 { color: #34B7F1; }
        .success { color: #4CAF50; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ZeusChat Admin Dashboard</h1>

        <p>Username: {{ session.get('admin_username', 'None') }}</p>
        <a href="/admin/login" style="color: #34B7F1;">Logout</a>
    </div>
</body>
</html>
