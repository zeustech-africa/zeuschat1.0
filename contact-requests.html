<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="csrf-token" content="">
  <title>Contact Requests — ZeusChat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #000;
      overflow-y: auto;
      min-height: 100vh;
      color: #fff;
    }
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 0;
    }
    .header {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .logo {
      height: 32px;
      margin-bottom: 4px;
    }
    .byline {
      font-size: 12px;
      color: #FFD700;
      font-weight: 500;
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 100px auto 50px;
      padding: 20px;
    }
    .page-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .page-header h1 {
      color: #FFD700;
      font-size: 32px;
      margin-bottom: 10px;
    }
    .page-header p {
      color: #aaa;
      font-size: 16px;
    }
    .request-card {
      background: rgba(34, 34, 34, 0.95);
      border: 2px solid #FFD700;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s ease;
    }
    .request-card:hover {
      border-color: #fff;
      background: rgba(44, 44, 44, 0.95);
    }
    .request-info {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .profile-pic {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #FFD700;
      overflow: hidden;
    }
    .profile-pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .request-details h3 {
      color: #FFD700;
      margin: 0 0 5px 0;
      font-size: 20px;
    }
    .request-details .zeus-pin {
      color: #888;
      font-size: 14px;
      margin-bottom: 5px;
      font-family: monospace;
    }
    .request-details .requested-at {
      color: #666;
      font-size: 13px;
    }
    .request-actions {
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }
    .accept-btn, .decline-btn {
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .accept-btn {
      background: #28a745;
      color: white;
    }
    .accept-btn:hover {
      background: #218838;
      transform: translateY(-2px);
    }
    .accept-btn:disabled {
      background: #555;
      cursor: not-allowed;
      transform: none;
    }
    .decline-btn {
      background: #dc3545;
      color: white;
    }
    .decline-btn:hover {
      background: #c82333;
      transform: translateY(-2px);
    }
    .decline-btn:disabled {
      background: #555;
      cursor: not-allowed;
      transform: none;
    }
    .no-requests {
      text-align: center;
      padding: 60px 40px;
      background: rgba(34, 34, 34, 0.9);
      border-radius: 12px;
      color: #888;
    }
    .no-requests h2 {
      color: #FFD700;
      margin-bottom: 16px;
      font-size: 28px;
    }
    .no-requests p {
      font-size: 16px;
    }
    .back-link {
      text-align: center;
      margin-top: 40px;
    }
    .back-link a {
      color: #FFD700;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      transition: color 0.2s;
    }
    .back-link a:hover {
      color: #fff;
    }
    .loading {
      text-align: center;
      padding: 60px;
      color: #FFD700;
      font-size: 18px;
    }
    .error {
      text-align: center;
      padding: 40px;
      background: rgba(220, 53, 69, 0.2);
      border: 2px solid #dc3545;
      border-radius: 12px;
      color: #dc3545;
    }

/* Mobile Responsive Styles */
@media (max-width: 768px) {
    body {
        padding: 16px;
    }

    .container, .card, .main-content {
        padding: 20px 16px;
        margin: 0;
        width: 100%;
        border-radius: 24px;
    }

    h1 {
        font-size: 28px;
    }

    h2 {
        font-size: 22px;
    }

    button, .btn-primary, .btn-secondary {
        padding: 14px 20px;
        font-size: 16px;
    }

    input, textarea, select {
        padding: 14px;
        font-size: 16px;
    }

    .sidebar {
        position: fixed;
        left: -280px;
        transition: left 0.3s;
        z-index: 1000;
    }

    .sidebar.open {
        left: 0;
    }

    .menu-toggle {
        display: block;
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 1001;
        background: #D4AF37;
        border: none;
        border-radius: 8px;
        padding: 10px;
        cursor: pointer;
    }

    .main-content {
        margin-left: 0;
        padding: 60px 16px 20px;
    }

    .admin-table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
    }

    .feature-grid, .pricing-grid {
        grid-template-columns: 1fr;
    }

    .chat-container {
        flex-direction: column;
    }

    .message {
        max-width: 85%;
    }

    body {
        font-size: 14px;
    }

    button, a, .clickable {
        min-height: 44px;
    }
}
  </style>
  <link rel="stylesheet" href="/static/mobile.css">
</head>
<body>
  <video class="video-bg" autoplay muted loop>
    <source src="zeustech-register.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <!-- Top-left: Logo + Byline -->
  <div class="header">
    <img src="zeustech-logo-zeushchat.png" class="logo" alt="ZeusTech">
    <div class="byline">ZeusChat by ZeusTech</div>
  </div>

  <div class="container">
    <div class="page-header">
      <h1>📬 Contact Requests</h1>
      <p>Accept or decline incoming contact requests</p>
    </div>

    <div id="requests-list">
      <div class="loading">Loading requests...</div>
    </div>

    <div class="back-link">
      <a href="chat.html">← Back to Chat</a>
    </div>
  </div>

  <script>
    console.log('=== CONTACT REQUESTS PAGE LOAD ===');
    let csrfToken = null;

    function getCsrfToken() {
      const metaToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
      return csrfToken || metaToken;
    }

    async function ensureCsrfToken(forceRefresh = false) {
      if (csrfToken && !forceRefresh) {
        return csrfToken;
      }

      const API_BASE = window.location.origin;
      const response = await fetch(`${API_BASE}/api/csrf-token`, {
        method: 'GET',
        credentials: 'include'
      });

      const data = await response.json();
      csrfToken = data.csrf_token || '';
      const meta = document.querySelector('meta[name="csrf-token"]');
      if (meta && csrfToken) {
        meta.setAttribute('content', csrfToken);
      }
      return csrfToken;
    }
    
    // Check authentication
    window.addEventListener('DOMContentLoaded', () => {
      const isLoggedIn = sessionStorage.getItem('user_logged_in') === 'true';
      const userPin = sessionStorage.getItem('user_zeus_pin');
      
      console.log('Session check:', { isLoggedIn, userPin });
      
      if (!isLoggedIn || !userPin) {
        console.log('Not logged in, redirecting to login');
        sessionStorage.setItem('return_url', 'contact-requests.html');
        window.location.href = 'login.html';
        return;
      }

      ensureCsrfToken().catch((error) => {
        console.warn('Failed to initialize CSRF token:', error);
      });
      
      // Load pending requests
      loadPendingRequests();
    });

    async function loadPendingRequests() {
      console.log('Loading pending contact requests...');
      
      try {
        const API_BASE = window.location.origin;
        const response = await fetch(`${API_BASE}/api/get-contact-requests`, {
          method: 'GET',
          credentials: 'include'
        });
        
        const data = await response.json();
        console.log('API Response:', data);
        
        const requestsList = document.getElementById('requests-list');
        
        if (response.ok && data.success && data.requests && data.requests.length > 0) {
          console.log(`Displaying ${data.requests.length} pending requests`);
          
          // Display requests
          requestsList.innerHTML = data.requests.map(request => {
            const profilePic = request.profile_pic 
              ? `<img src="${request.profile_pic}" alt="${request.full_name}">` 
              : request.full_name.charAt(0).toUpperCase();
            
            const requestDate = new Date(request.created_at);
            const formattedDate = requestDate.toLocaleString('en-US', {
              month: 'short',
              day: 'numeric',
              hour: 'numeric',
              minute: '2-digit'
            });
            
            return `
              <div class="request-card" id="request-${request.contact_id}">
                <div class="request-info">
                  <div class="profile-pic">${profilePic}</div>
                  <div class="request-details">
                    <h3>${escapeHtml(request.full_name || 'Unknown User')}</h3>
                    <div class="zeus-pin">${escapeHtml(request.zeus_pin)}</div>
                    <div class="requested-at">Requested: ${formattedDate}</div>
                  </div>
                </div>
                <div class="request-actions">
                  <button class="accept-btn" onclick="acceptContact(${request.contact_id}, '${escapeHtml(request.zeus_pin)}')">
                    ✓ Accept
                  </button>
                  <button class="decline-btn" onclick="declineContact(${request.contact_id}, '${escapeHtml(request.zeus_pin)}')">
                    ✗ Decline
                  </button>
                </div>
              </div>
            `;
          }).join('');
        } else {
          // No pending requests
          console.log('No pending requests found');
          requestsList.innerHTML = `
            <div class="no-requests">
              <h2>📭 No Pending Requests</h2>
              <p>You don't have any pending contact requests at the moment.</p>
            </div>
          `;
        }
      } catch (error) {
        console.error('Error loading requests:', error);
        document.getElementById('requests-list').innerHTML = `
          <div class="error">
            <h3>⚠️ Error Loading Requests</h3>
            <p>${error.message || 'Failed to connect to server'}</p>
            <p style="margin-top: 16px;">
              <a href="javascript:location.reload()" style="color: #FFD700;">Refresh Page</a>
            </p>
          </div>
        `;
      }
    }

    async function acceptContact(contactId, requesterPin) {
      console.log(`Accepting contact request ${contactId} from ${requesterPin}`);
      
      const card = document.getElementById(`request-${contactId}`);
      const acceptBtn = card.querySelector('.accept-btn');
      const declineBtn = card.querySelector('.decline-btn');
      
      acceptBtn.disabled = true;
      declineBtn.disabled = true;
      acceptBtn.textContent = 'Accepting...';
      
      try {
        const API_BASE = window.location.origin;
        const token = await ensureCsrfToken();
        const response = await fetch(`${API_BASE}/api/accept-contact`, {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': token || getCsrfToken()
          },
          body: JSON.stringify({ contact_id: contactId })
        });
        
        const data = await response.json();
        console.log('Accept response:', data);
        
        if (response.ok && data.success) {
          console.log(`✅ Contact accepted: ${requesterPin}`);
          alert(`✅ Contact accepted! You can now chat with ${requesterPin}`);
          
          // Remove the card with animation
          card.style.transition = 'all 0.3s ease';
          card.style.opacity = '0';
          card.style.transform = 'translateX(100px)';
          
          setTimeout(() => {
            loadPendingRequests(); // Reload the list
          }, 300);
        } else {
          throw new Error(data.error || 'Failed to accept contact');
        }
      } catch (error) {
        console.error('Accept contact error:', error);
        alert('Error: ' + error.message);
        acceptBtn.disabled = false;
        declineBtn.disabled = false;
        acceptBtn.textContent = '✓ Accept';
      }
    }

    async function declineContact(contactId, requesterPin) {
      if (!confirm(`Decline contact request from ${requesterPin}?`)) {
        return;
      }
      
      console.log(`Declining contact request ${contactId} from ${requesterPin}`);
      
      const card = document.getElementById(`request-${contactId}`);
      const acceptBtn = card.querySelector('.accept-btn');
      const declineBtn = card.querySelector('.decline-btn');
      
      acceptBtn.disabled = true;
      declineBtn.disabled = true;
      declineBtn.textContent = 'Declining...';
      
      try {
        const API_BASE = window.location.origin;
        const token = await ensureCsrfToken();
        
        const response = await fetch(`${API_BASE}/api/decline-contact`, {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': token || getCsrfToken()
          },
          body: JSON.stringify({ contact_id: contactId })
        });
        
        const data = await response.json();
        console.log('Decline response:', data);
        
        if (response.ok && data.success) {
          console.log(`✅ Contact declined: ${requesterPin}`);
          alert('Contact request declined');
          
          // Remove the card with animation
          card.style.transition = 'all 0.3s ease';
          card.style.opacity = '0';
          card.style.transform = 'translateX(-100px)';
          
          setTimeout(() => {
            loadPendingRequests(); // Reload the list
          }, 300);
        } else {
          throw new Error(data.error || 'Failed to decline contact');
        }
      } catch (error) {
        console.error('Decline contact error:', error);
        alert('Error: ' + error.message);
        acceptBtn.disabled = false;
        declineBtn.disabled = false;
        declineBtn.textContent = '✗ Decline';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
