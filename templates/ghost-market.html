<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ghost Market - ZeusChat</title>
    <link rel="stylesheet" href="/static/mobile.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
            padding-bottom: 80px;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 15px;
        }
        h1 {
            color: #D4AF37;
            font-size: 28px;
        }
        .subtitle {
            color: rgba(255,255,255,0.6);
            margin-bottom: 24px;
        }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            padding: 14px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 40px;
            color: white;
            font-size: 16px;
            min-height: 44px;
        }
        .search-bar select, .search-bar button {
            padding: 14px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 40px;
            color: white;
            cursor: pointer;
            min-height: 44px;
        }
        .search-bar select option { background: #1a1a1a; }
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .item-card {
            background: rgba(17, 17, 17, 0.95);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .item-card:hover { transform: translateY(-4px); }
        .item-image {
            width: 100%;
            height: 200px;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #D4AF37;
            font-size: 48px;
        }
        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .item-info { padding: 16px; }
        .item-title {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .item-price {
            color: #D4AF37;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .item-seller {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 12px;
        }
        .buy-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #D4AF37 0%, #B8960C 100%);
            color: #0a0a0a;
            border: none;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            min-height: 44px;
        }
        .seller-section {
            margin-top: 40px;
            padding: 20px;
            background: rgba(212,175,55,0.1);
            border-radius: 20px;
            text-align: center;
        }
        .seller-section h3 { margin-bottom: 8px; color: #D4AF37; }
        .seller-section p { color: rgba(255,255,255,0.6); margin-bottom: 16px; }
        .sell-btn {
            padding: 14px 28px;
            background: linear-gradient(135deg, #D4AF37 0%, #B8960C 100%);
            color: #0a0a0a;
            border: none;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            min-height: 44px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.5);
        }
        @media (max-width: 768px) {
            .container { padding: 16px; }
            .items-grid { grid-template-columns: 1fr; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏪 Ghost Market</h1>
            <button class="sell-btn" id="sellBtn" style="display: none;">📦 Sell an Item</button>
        </div>
        <p class="subtitle">Buy and sell anonymously. No names. No shame. Every item reviewed by admin.</p>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search ghost market...">
            <select id="categoryFilter">
                <option value="">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Clothing">Clothing</option>
                <option value="Furniture">Furniture</option>
                <option value="Books">Books</option>
                <option value="Home">Home &amp; Garden</option>
                <option value="Sports">Sports</option>
                <option value="Toys">Toys &amp; Hobbies</option>
                <option value="Other">Other</option>
            </select>
            <button id="searchBtn">🔍 Search</button>
        </div>

        <div id="itemsGrid" class="items-grid">
            <div class="loading">Loading ghost market...</div>
        </div>

        <div id="sellerSection" class="seller-section" style="display: none;">
            <h3>Become a Ghost Seller</h3>
            <p>Sell your used items anonymously. Admin approves every listing.</p>
            <button id="applySellerBtn" class="sell-btn">Apply to Sell →</button>
        </div>
    </div>

    <!-- Mobile Bottom Navigation -->
    <div class="mobile-bottom-nav mobile-only">
        <button class="nav-item-mobile" data-page="chat">
            <span class="nav-icon">💬</span>
            <span>Chats</span>
        </button>
        <button class="nav-item-mobile" data-page="profile">
            <span class="nav-icon">👤</span>
            <span>Profile</span>
        </button>
        <button class="nav-item-mobile active" data-page="market">
            <span class="nav-icon">🏪</span>
            <span>Market</span>
        </button>
        <button class="nav-item-mobile" data-page="settings">
            <span class="nav-icon">⚙️</span>
            <span>Settings</span>
        </button>
        <button class="nav-item-mobile" data-page="upgrade">
            <span class="nav-icon">💎</span>
            <span>Upgrade</span>
        </button>
    </div>

    <script>
        let isSeller = false;

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        async function loadItems() {
            const search = document.getElementById('searchInput').value;
            const category = document.getElementById('categoryFilter').value;

            try {
                const response = await fetch(
                    '/api/ghost-market/items?search=' + encodeURIComponent(search) +
                    '&category=' + encodeURIComponent(category)
                );
                const data = await response.json();

                if (data.success && data.items.length > 0) {
                    const grid = document.getElementById('itemsGrid');
                    grid.innerHTML = data.items.map(item => {
                        const imgHtml = item.images
                            ? '<img src="/' + escapeHtml(item.images.split(',')[0]) + '" alt="' + escapeHtml(item.title) + '">'
                            : '📦';
                        return '<div class="item-card" onclick="viewItem(' + item.id + ')">' +
                            '<div class="item-image">' + imgHtml + '</div>' +
                            '<div class="item-info">' +
                            '<div class="item-title">' + escapeHtml(item.title) + '</div>' +
                            '<div class="item-price">R' + item.price + '</div>' +
                            '<div class="item-seller">Seller: ' + escapeHtml(item.seller_pin_half || 'ZT-XXXX') + '</div>' +
                            '<button class="buy-btn" onclick="event.stopPropagation(); buyItem(' + item.id + ')">Buy Now</button>' +
                            '</div></div>';
                    }).join('');
                } else {
                    document.getElementById('itemsGrid').innerHTML = '<div class="loading">No items found in Ghost Market</div>';
                }
            } catch (err) {
                document.getElementById('itemsGrid').innerHTML = '<div class="loading">Failed to load items</div>';
            }
        }

        function viewItem(itemId) {
            window.location.href = '/ghost-market/item/' + itemId;
        }

        async function buyItem(itemId) {
            if (!confirm('Buy this item? Payment will be held in escrow until you confirm receipt.')) return;

            try {
                const response = await fetch('/api/ghost-market/buy/' + itemId, { method: 'POST' });
                const data = await response.json();

                if (data.success && data.redirect_url) {
                    window.location.href = data.redirect_url;
                } else {
                    alert(data.error || 'Unable to process purchase');
                }
            } catch (err) {
                alert('Network error. Please try again.');
            }
        }

        async function checkSellerStatus() {
            try {
                const response = await fetch('/api/ghost-market/seller-status');
                const data = await response.json();

                if (data.is_seller) {
                    isSeller = true;
                    document.getElementById('sellBtn').style.display = 'block';
                    document.getElementById('sellerSection').style.display = 'none';
                } else {
                    document.getElementById('sellerSection').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('sellerSection').style.display = 'block';
            }
        }

        document.getElementById('sellBtn').addEventListener('click', function () {
            window.location.href = '/ghost-market/sell';
        });

        document.getElementById('applySellerBtn').addEventListener('click', function () {
            window.location.href = '/ghost-market/apply-seller';
        });

        document.getElementById('searchBtn').addEventListener('click', loadItems);
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') loadItems();
        });

        // Mobile navigation
        document.querySelectorAll('.nav-item-mobile').forEach(function (item) {
            item.addEventListener('click', function () {
                const page = item.dataset.page;
                const pages = {
                    'chat': '/chat.html',
                    'profile': '/profile.html',
                    'market': '/ghost-market',
                    'settings': '/settings.html',
                    'upgrade': '/subscription'
                };
                if (pages[page]) window.location.href = pages[page];
            });
        });

        loadItems();
        checkSellerStatus();
    </script>
</body>
</html>
