<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ZeusChat - Ghost Mode Messaging</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3e 50%, #2a1a4e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 380px;
            width: 100%;
            margin: 0 auto;
        }

        /* Main Card */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 48px 24px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* 3D Spinning Logo Container */
        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 24px;
            perspective: 800px;
        }

        .logo-3d {
            width: 100%;
            height: 100%;
            position: relative;
            animation: spin3D 8s infinite linear;
            transform-style: preserve-3d;
        }

        .logo-face {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.4);
            backface-visibility: visible;
        }

        .logo-face-front {
            transform: translateZ(30px);
        }

        .logo-face-back {
            transform: rotateY(180deg) translateZ(30px);
        }

        .logo-face-right {
            transform: rotateY(90deg) translateZ(30px);
        }

        .logo-face-left {
            transform: rotateY(-90deg) translateZ(30px);
        }

        .logo-face-top {
            transform: rotateX(90deg) translateZ(30px);
        }

        .logo-face-bottom {
            transform: rotateX(-90deg) translateZ(30px);
        }

        @keyframes spin3D {
            0% { transform: rotateY(0deg) rotateX(0deg); }
            100% { transform: rotateY(360deg) rotateX(360deg); }
        }

        /* Simple fallback for browsers that don't support 3D */
        .simple-logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 48px;
            box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.4);
        }

        h1 {
            font-size: 32px;
            color: white;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .ghost-mode {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 3px;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .tagline {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 40px;
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        /* Footer */
        .footer {
            margin-top: 24px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        /* Install Button (for PWA) */
        .install-pwa {
            background: rgba(255, 255, 255, 0.15);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            padding: 12px;
            border-radius: 40px;
            margin-top: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
        }

        .install-pwa:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Hide 3D on browsers that don't support it */
        @supports not (transform-style: preserve-3d) {
            .logo-3d {
                display: none;
            }
            .simple-logo {
                display: flex;
            }
        }

        .simple-logo {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- 3D Spinning Logo -->
            <div class="logo-container">
                <div class="logo-3d">
                    <div class="logo-face logo-face-front">🛡️</div>
                    <div class="logo-face logo-face-back">⚡</div>
                    <div class="logo-face logo-face-right">🔒</div>
                    <div class="logo-face logo-face-left">💬</div>
                    <div class="logo-face logo-face-top">✨</div>
                    <div class="logo-face logo-face-bottom">🌟</div>
                </div>
                <div class="simple-logo">🛡️</div>
            </div>

            <h1>ZEUSCHAT</h1>
            <div class="ghost-mode">GHOST MODE MESSAGING</div>
            <div class="tagline">Simple. Secure. Reliable.</div>

            <!-- Get Started Button -->
            <button class="btn-primary" id="getStartedBtn">Get Started →</button>

            <!-- Login Button -->
            <button class="btn-secondary" id="loginBtn">Login</button>

            <div class="divider">
                <div class="divider-line"></div>
                <span>⚡</span>
                <div class="divider-line"></div>
            </div>

            <!-- PWA Install Button (appears when available) -->
            <div class="install-pwa" id="installBtn" style="display: none;">
                📱 Install App on Home Screen
            </div>

            <div class="footer">
                🔒 End-to-end encrypted • No phone number required • Your privacy matters
            </div>
        </div>
    </div>

    <script>
        // Get Started button - redirect to registration
        document.getElementById('getStartedBtn').addEventListener('click', () => {
            window.location.href = '/registration.html';
        });

        // Login button - redirect to login
        document.getElementById('loginBtn').addEventListener('click', () => {
            window.location.href = '/login.html';
        });

        // PWA Install Prompt
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('User installed PWA');
                }
                deferredPrompt = null;
                installBtn.style.display = 'none';
            } else {
                alert('Tap Share → Add to Home Screen (iPhone) or Menu → Install App (Android)');
            }
        });

        // Hide install button if already installed
        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
        });
    </script>
</body>
</html>
