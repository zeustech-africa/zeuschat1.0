<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ZeusChat Revolution</title>
  <desc id="desc">Abstract gold and black composition representing private communication across Africa.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#171722"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f3e5ab"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="215" cy="160" r="145" fill="#d4af37" opacity="0.14"/>
  <circle cx="990" cy="650" r="210" fill="#d4af37" opacity="0.08"/>
  <path d="M95 540C255 430 405 390 548 435C690 480 812 614 1105 584" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" opacity="0.82"/>
  <path d="M202 235L434 235" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M748 532L1005 532" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
  <g fill="none" stroke="url(#gold)" stroke-width="4">
    <rect x="128" y="205" width="172" height="280" rx="34"/>
    <rect x="476" y="150" width="228" height="360" rx="40"/>
    <rect x="830" y="262" width="178" height="296" rx="36"/>
  </g>
  <g fill="#ffffff">
    <text x="130" y="640" font-family="Georgia, serif" font-size="60">Private by design.</text>
    <text x="130" y="700" font-family="Segoe UI, sans-serif" font-size="28" fill="#d7d7d7">Zeus-PIN identity replaces phone-number dependency.</text>
  </g>
</svg>