services:
  - type: web
    name: zeuschat
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PORT
        value: "5000"
      - key: JWT_SECRET
        value: "your-secret-key-change-in-production"
      - key: DEBUG_MODE
        value: "false"
      - key: FRONTEND_URL
        value: "https://zeuschat.onrender.com"
