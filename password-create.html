<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Password — ZeusChat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #000;
      overflow: hidden;
      height: 100vh;
      color: #fff;
    }
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 0;
    }
    .header {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .logo {
      height: 32px;
      margin-bottom: 4px;
    }
    .byline {
      font-size: 12px;
      color: #FFD700;
      font-weight: 500;
    }
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .box {
      background: #222;
      border-radius: 12px;
      padding: 24px;
      margin: 16px 0;
      width: 100%;
      max-width: 600px;
      text-align: left;
    }
    .box-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #fff;
    }
    .input-group {
      margin-bottom: 16px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: #333;
      border: 1px solid #444;
      color: #fff;
      border-radius: 6px;
    }
    .btn {
      background: #FFD700;
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 16px;
      width: 100%;
      max-width: 400px;
    }
    .note {
      background: #1a1a1a;
      border-left: 4px solid #d4af37;
      padding: 12px;
      margin-top: 16px;
      font-size: 13px;
      text-align: left;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <video class="video-bg" autoplay muted loop>
    <source src="zeustech-register.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <!-- Top-left: Logo + Byline -->
  <div class="header">
    <img src="zeustech-logo-zeushchat.png" class="logo" alt="ZeusTech">
    <div class="byline">ZeusChat by ZeusTech</div>
  </div>

  <div class="container">
    <div class="box">
      <div class="box-title">Create your password</div>
      <div class="input-group">
        <div style="margin-bottom: 8px; font-size: 14px; color: #FFD700;">Your Zeus-PIN: <span id="zeusPinDisplay"></span></div>
        <input type="password" id="password" placeholder="Create a strong password" />
      </div>
      <button class="btn" id="createBtn" onclick="createAccount()">Create Account</button>
      <div class="note">
        Your password protects your identity.<br>
        A unique cryptographic key will be generated for secure messaging.
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    // Enforce step-locked flow
    const myZeusPin = localStorage.getItem('my_zeus_pin');
    if (!myZeusPin || myZeusPin === 'ZT-XXXX-XXXX') {
      alert('Session expired. Please start over.');
      window.location.href = 'emailinput.html';
    }

    // Display real Zeus-PIN
    document.getElementById('zeusPinDisplay').textContent = myZeusPin;

    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        createAccount();
      }
    });

    async function createAccount() {
      const passwordInput = document.getElementById('password');
      const createBtn = document.getElementById('createBtn');

      // Prevent double submission
      if (createBtn.disabled) return;
      createBtn.disabled = true;
      createBtn.textContent = 'Creating...';

      const email = localStorage.getItem('registration_email');
      const password = passwordInput.value.trim();
      const full_name = localStorage.getItem('registration_full_name');
      const zeus_pin = localStorage.getItem('my_zeus_pin');

      // Validate inputs
      if (!email || !full_name || !zeus_pin) {
        alert('Session invalid. Please start over.');
        window.location.href = 'emailinput.html';
        return;
      }

      if (!password || password.length < 6) {
        alert('Password must be at least 6 characters.');
        createBtn.disabled = false;
        createBtn.textContent = 'Create Account';
        return;
      }

      try {
        console.log('📝 Completing registration...');
        console.log('📧 Email:', email);
        console.log('👤 Name:', full_name);
        console.log('🔐 Zeus PIN:', zeus_pin);
        
        // Step 1: Complete registration with /api/complete-registration
        const registerResponse = await fetch(`${API_BASE}/api/complete-registration`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            email, 
            zeus_pin, 
            password, 
            full_name
          })
        });
        
        console.log('📡 Registration response:', registerResponse.status);
        const registerResult = await registerResponse.json();
        console.log('📊 Registration response:', registerResult);

        if (!registerResponse.ok) {
          throw new Error(registerResult.error || 'Registration failed');
        }

        if (!registerResult.user_id) {
          throw new Error('Invalid registration response: no user_id');
        }

        console.log('✅ Registration complete. User ID:', registerResult.user_id);
        
        // Step 2: Login immediately after registration
        console.log('🔐 Logging in...');
        const loginResponse = await fetch(`${API_BASE}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            zeus_pin: zeus_pin, 
            password: password 
          })
        });
        
        console.log('📡 Login response status:', loginResponse.status);
        const loginResult = await loginResponse.json();
        console.log('📊 Login response:', loginResult);

        if (!loginResponse.ok) {
          throw new Error(loginResult.error || 'Login failed after registration');
        }

        if (!loginResult.user || !loginResult.user.id) {
          throw new Error('Invalid login response');
        }

        console.log('✅ Login successful!');
        
        // Save authenticated session data
        localStorage.setItem('user_id', loginResult.user.id);
        localStorage.setItem('user_email', loginResult.user.email);
        localStorage.setItem('user_name', loginResult.user.full_name);
        localStorage.setItem('zeus_pin', zeus_pin);
        
        // Clear temporary registration data
        localStorage.removeItem('pending_email');
        localStorage.removeItem('registration_email');
        localStorage.removeItem('registration_full_name');
        localStorage.removeItem('my_zeus_pin');
        
        console.log('🎉 Redirecting to chat...');
        // Redirect to chat
        window.location.href = 'chat.html';
      } catch (error) {
        console.error('❌ Registration/login error:', error);
        alert('Error: ' + (error.message || 'Failed to create account. Please try again.'));
        createBtn.disabled = false;
        createBtn.textContent = 'Create Account';
      }
    }
  </script>
</body>
</html>
