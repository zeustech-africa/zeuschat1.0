<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Profile - ZeusChat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
        }
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.3;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        .profile-header {
            text-align: center;
            margin-bottom: 40px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #FFD700;
            border-radius: 15px;
            padding: 30px;
        }
        .profile-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #FFD700;
            margin-bottom: 20px;
        }
        .profile-name {
            font-size: 2em;
            color: #FFD700;
            margin-bottom: 10px;
        }
        .profile-pin {
            color: #888;
            font-size: 1.1em;
            margin-bottom: 20px;
        }
        .profile-status {
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .status-online {
            background: rgba(40, 167, 69, 0.2);
            color: #28a745;
        }
        .status-offline {
            background: rgba(136, 136, 136, 0.2);
            color: #888;
        }
        .profile-section {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #FFD700;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .profile-section h3 {
            color: #FFD700;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            padding-bottom: 10px;
        }
        .profile-field {
            margin-bottom: 15px;
        }
        .profile-field label {
            display: block;
            color: #888;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        .profile-field .value {
            display: block;
            color: #fff;
            font-size: 1.1em;
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .action-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .message-btn {
            background: #FFD700;
            color: #000;
        }
        .message-btn:hover {
            background: #FFA500;
            transform: translateY(-2px);
        }
        .block-btn {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border: 2px solid #dc3545;
        }
        .block-btn:hover {
            background: rgba(220, 53, 69, 0.3);
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #FFD700;
            text-decoration: none;
            font-size: 1.1em;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <video autoplay muted loop playsinline class="video-bg">
        <source src="zeuschat-profile.mp4" type="video/mp4">
    </video>

    <div class="container">
        <div class="profile-header">
            <img id="profile-avatar" class="profile-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 150 150'%3E%3Crect fill='%23222' width='150' height='150'/%3E%3Ctext fill='%23FFD700' font-size='60' x='50%25' y='50%25' text-anchor='middle' dy='.3em'%3E👤%3C/text%3E%3C/svg%3E" alt="Profile">
            <h1 id="profile-name" class="profile-name">Loading...</h1>
            <div id="profile-pin" class="profile-pin">ZT-XXXX-XXXX</div>
            <div id="profile-status" class="profile-status status-offline">Offline</div>
        </div>

        <div class="profile-section">
            <h3>📝 About</h3>
            <div class="profile-field">
                <label>Bio</label>
                <div class="value" id="profile-about">-</div>
            </div>
        </div>

        <div class="profile-section">
            <h3>🔐 Security</h3>
            <div class="profile-field">
                <label>Zeus-PIN</label>
                <div class="value" id="security-pin">-</div>
            </div>
            <div class="profile-field">
                <label>Member Since</label>
                <div class="value" id="member-since">-</div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="action-btn message-btn" onclick="startChat()">💬 Send Message</button>
            <button class="action-btn block-btn" onclick="blockContact()">🚫 Block Contact</button>
        </div>

        <div class="back-link">
            <a href="/chat.html">← Back to Chat</a>
        </div>
    </div>

    <script>
        // Check session
        const isLoggedIn = sessionStorage.getItem('user_logged_in') === 'true';
        if (!isLoggedIn) {
            alert('Please log in first');
            window.location.href = 'login.html';
        }

        // Load contact profile on page load
        window.addEventListener('DOMContentLoaded', async () => {
            const contactPin = new URLSearchParams(window.location.search).get('pin');
            
            if (!contactPin) {
                alert('No contact selected');
                window.location.href = '/chat.html';
                return;
            }
            
            await loadContactProfile(contactPin);
        });

        async function loadContactProfile(contactPin) {
            console.log('🔍 Loading profile for:', contactPin);
            
            try {
                // Get viewer's PIN from session to enable privacy check
                const viewerPin = sessionStorage.getItem('user_zeus_pin');
                let url = `/api/get-contact-profile?contact_pin=${encodeURIComponent(contactPin)}`;
                
                // Include viewer PIN for proper privacy enforcement
                if (viewerPin) {
                    url += `&viewer_pin=${encodeURIComponent(viewerPin)}`;
                }
                
                console.log('📡 Fetching:', url);
                
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('📥 Response:', data);
                
                if (response.ok && data.success) {
                    const contact = data.contact;
                    
                    // Update profile
                    document.getElementById('profile-name').textContent = contact.full_name || 'Unknown User';
                    document.getElementById('profile-pin').textContent = contact.zeus_pin;
                    document.getElementById('profile-avatar').src = contact.profile_pic || 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 150 150\'%3E%3Crect fill=\'%23222\' width=\'150\' height=\'150\'/%3E%3Ctext fill=\'%23FFD700\' font-size=\'60\' x=\'50%25\' y=\'50%25\' text-anchor=\'middle\' dy=\'.3em\'%3E👤%3C/text%3E%3C/svg%3E';
                    document.getElementById('profile-about').textContent = contact.about || 'No bio provided';
                    document.getElementById('security-pin').textContent = contact.zeus_pin;
                    document.getElementById('member-since').textContent = new Date(contact.created_at).toLocaleDateString();
                    
                    // Update status
                    const statusDiv = document.getElementById('profile-status');
                    if (data.status === 'online') {
                        statusDiv.className = 'profile-status status-online';
                        statusDiv.textContent = '● Online';
                    } else {
                        statusDiv.className = 'profile-status status-offline';
                        statusDiv.textContent = `Last seen ${data.last_seen_formatted || 'recently'}`;
                    }
                    
                    // Hide loading, show content
                    document.querySelector('.profile-header').style.opacity = '1';
                    document.querySelectorAll('.profile-section').forEach(section => {
                        section.style.display = 'block';
                    });
                    
                    // Store for actions
                    sessionStorage.setItem('viewing_contact_pin', contactPin);
                    
                    console.log('✅ Profile loaded successfully');
                } else {
                    console.error('❌ API error:', data.error);
                    alert(`Failed to load contact profile: ${data.error || 'Unknown error'}`);
                }
            } catch (error) {
                console.error('❌ Load profile error:', error);
                alert('Failed to connect to server. Please try again.');
            }
        }

        function startChat() {
            const contactPin = sessionStorage.getItem('viewing_contact_pin');
            sessionStorage.setItem('current_chat_partner', contactPin);
            window.location.href = '/chat.html';
        }

        async function blockContact() {
            const contactPin = sessionStorage.getItem('viewing_contact_pin');
            const userPin = sessionStorage.getItem('user_zeus_pin');
            
            if (!confirm(`Block ${contactPin}? They won't be able to message you.`)) {
                return;
            }
            
            const pin = prompt('Enter your Zeus-PIN to confirm:');
            if (pin !== userPin) {
                alert('Incorrect PIN');
                return;
            }
            
            try {
                const API_BASE = window.location.origin;
                const response = await fetch(`${API_BASE}/api/block-contact`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        zeus_pin: contactPin
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    alert(`${contactPin} has been blocked`);
                    window.location.href = '/chat.html';
                } else {
                    alert(data.error || 'Failed to block contact');
                }
            } catch (error) {
                console.error('Block contact error:', error);
                alert('Failed to block contact');
            }
        }
    </script>
</body>
</html>
