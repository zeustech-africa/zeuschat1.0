<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ZeusChat Administration - Control Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(ellipse at 20% 30%, #0f0f1a 0%, #050508 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        .floating-ghost {
            position: fixed;
            font-size: 60px;
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
            animation: floatGhost 20s infinite ease-in-out;
        }

        @keyframes floatGhost {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(50px, -30px) rotate(5deg); }
            50% { transform: translate(-30px, 50px) rotate(-5deg); }
            75% { transform: translate(40px, 30px) rotate(3deg); }
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(212,175,55,0.05) 0%, transparent 30%),
                radial-gradient(circle at 90% 70%, rgba(212,175,55,0.03) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        .admin-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .admin-two-col {
            display: flex;
            gap: 60px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .admin-brand-col {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
            text-align: center;
        }

        .admin-login-col {
            flex: 0.8;
            min-width: 320px;
            max-width: 420px;
        }

        .logo-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 24px;
            perspective: 800px;
        }

        .logo-3d {
            width: 100%;
            height: 100%;
            position: relative;
            animation: spin3D 8s infinite linear;
            transform-style: preserve-3d;
        }

        .logo-face {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #D4AF37 0%, #B8960C 100%);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(212, 175, 55, 0.4);
            backface-visibility: visible;
            overflow: hidden;
        }

        .logo-face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 28px;
        }

        .logo-face-front { transform: translateZ(30px); }
        .logo-face-back { transform: rotateY(180deg) translateZ(30px); }
        .logo-face-right { transform: rotateY(90deg) translateZ(30px); }
        .logo-face-left { transform: rotateY(-90deg) translateZ(30px); }
        .logo-face-top { transform: rotateX(90deg) translateZ(30px); }
        .logo-face-bottom { transform: rotateX(-90deg) translateZ(30px); }

        @keyframes spin3D {
            0% { transform: rotateY(0deg) rotateX(0deg); }
            100% { transform: rotateY(360deg) rotateX(360deg); }
        }

        .simple-logo {
            display: none;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #D4AF37 0%, #B8960C 100%);
            border-radius: 24px;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .simple-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 24px;
        }

        @supports not (transform-style: preserve-3d) {
            .logo-3d { display: none; }
            .simple-logo { display: flex; }
        }

        .zeuschat-title {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #D4AF37 0%, #F3E5AB 50%, #D4AF37 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            letter-spacing: 4px;
        }

        .administration-badge {
            font-size: 14px;
            letter-spacing: 6px;
            color: #D4AF37;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .tagline {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            line-height: 1.6;
        }

        .zeustech-credit {
            position: fixed;
            top: 20px;
            right: 30px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
            z-index: 100;
        }

        .login-card {
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 32px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(212, 175, 55, 0.1);
            transition: all 0.4s;
        }

        .login-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(212, 175, 55, 0.15), 0 0 0 1px rgba(212, 175, 55, 0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h2 {
            color: #D4AF37;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            color: white;
            font-size: 15px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #D4AF37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #D4AF37 0%, #B8960C 100%);
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            color: #0a0a0a;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(212, 175, 55, 0.4);
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(10, 10, 10, 0.25);
            border-top-color: #0a0a0a;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            display: none;
        }

        .security-badges {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .admin-two-col {
                flex-direction: column;
                gap: 40px;
            }
            .zeuschat-title {
                font-size: 36px;
            }
            .zeustech-credit {
                position: relative;
                text-align: center;
                margin-bottom: 20px;
                top: 0;
                right: 0;
            }
            .login-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="zeustech-credit">ZEUSCHAT BY ZEUSTECH</div>

    <div class="floating-ghost" style="top: 10%; left: 5%; animation-delay: 0s;">👻</div>
    <div class="floating-ghost" style="bottom: 15%; right: 8%; animation-delay: 2s;">👻</div>
    <div class="floating-ghost" style="top: 30%; right: 15%; animation-delay: 4s;">🕯️</div>
    <div class="floating-ghost" style="bottom: 25%; left: 12%; animation-delay: 1s;">✨</div>

    <div class="admin-container">
        <div class="admin-two-col">
            <div class="admin-brand-col">
                <div class="logo-container">
                    <div class="logo-3d">
                        <div class="logo-face logo-face-front">
                            <img src="/zeuschat-icon.png" alt="ZeusChat">
                        </div>
                        <div class="logo-face logo-face-back">
                            <img src="/zeuschat-icon.png" alt="ZeusChat">
                        </div>
                        <div class="logo-face logo-face-right">
                            <img src="/zeuschat-icon.png" alt="ZeusChat">
                        </div>
                        <div class="logo-face logo-face-left">
                            <img src="/zeuschat-icon.png" alt="ZeusChat">
                        </div>
                        <div class="logo-face logo-face-top">
                            <img src="/zeuschat-icon.png" alt="ZeusChat">
                        </div>
                        <div class="logo-face logo-face-bottom">
                            <img src="/zeuschat-icon.png" alt="ZeusChat">
                        </div>
                    </div>
                    <div class="simple-logo">
                        <img src="/zeuschat-icon.png" alt="ZeusChat">
                    </div>
                </div>
                <h1 class="zeuschat-title">ZEUSCHAT</h1>
                <div class="administration-badge">ADMINISTRATION</div>
                <p class="tagline">Complete platform control. Real-time oversight.<br>Full audit trail. Executive command center.</p>
            </div>

            <div class="admin-login-col">
                <div class="login-card">
                    <div class="login-header">
                        <h2>🔐 Control Room Access</h2>
                        <p>Authorized personnel only</p>
                    </div>

                    <form id="loginForm">
                        <div class="input-group">
                            <label>Username</label>
                            <input type="text" id="username" name="username" required autocomplete="off" placeholder="Enter your username">
                        </div>

                        <div class="input-group">
                            <label>Password</label>
                            <input type="password" id="password" name="password" required placeholder="Enter your password">
                        </div>

                        <button type="submit" id="loginBtn" class="login-btn">
                            Access Control Room
                        </button>
                    </form>

                    <div id="errorMessage" class="error-message"></div>

                    <div class="security-badges">
                        <span>🔐 SSL Secured</span>
                        <span>📋 Audit Logged</span>
                        <span>🛡️ Role Based</span>
                        <span>👻 Ghost Mode</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorDiv = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }

            setLoading(true);
            hideError();

            try {
                const response = await fetch('/admin/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    window.location.href = '/admin/dashboard';
                } else {
                    showError(data.error || 'Invalid credentials. Access denied.');
                    setLoading(false);
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Network error. Please check your connection.');
                setLoading(false);
            }
        });

        function setLoading(loading) {
            if (loading) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="spinner"></span> Authenticating...';
            } else {
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Access Control Room';
            }
        }

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
        }

        document.getElementById('username').addEventListener('input', hideError);
        document.getElementById('password').addEventListener('input', hideError);
    </script>
</body>
</html>
