<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/static/css/video-background.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Enter Email — ZeusChat</title>
  <link rel="stylesheet" href="/static/premium.css">
  <link rel="stylesheet" href="/static/mobile.css">
</head>
<body>

  <!-- 4K Background Video -->
  <video class="video-background" autoplay loop muted playsinline>
    <source src="/static/videos/ultra/register.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <div class="premium-container">
    <div class="premium-two-col">

      <!-- Form Column -->
      <div class="premium-form-col">
        <div class="premium-card">
          <div class="premium-logo">
            <span class="premium-logo-icon">🛡️</span>
            <h1>ZEUSCHAT</h1>
            <div class="premium-tagline">GHOST MODE MESSAGING</div>
          </div>

          <div class="premium-input-group">
            <label class="premium-label">Your Email Address</label>
            <input type="email" id="email" class="premium-input" placeholder="you@email.com" />
          </div>

          <button class="premium-btn" id="nextBtn" onclick="saveEmail()">Continue →</button>

          <div class="premium-note">
            <strong style="color: #D4AF37;">Test Mode Active:</strong><br />
            Enter any email → Next → Use code <strong>123456</strong><br />
            You'll get a unique Zeus-PIN for secure messaging.
          </div>
        </div>
      </div>

      <!-- Side Column -->
      <div class="premium-side-col">
        <div class="premium-side-card">
          <div class="fact-card" id="funFactCard">
            <span class="fact-icon" id="funFactIcon">✨</span>
            <div class="fact-title" id="funFactTitle">DID YOU KNOW?</div>
            <div class="fact-text" id="funFactText">ZeusChat is the FIRST messaging platform with an anonymous marketplace called GHOST MARKET.</div>
            <div class="fact-footer">Only the worthy enter.</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="floating-ghost" style="top: 10%; left: 5%;">👻</div>
  <div class="floating-ghost" style="bottom: 15%; right: 8%;">👻</div>
  <div class="floating-ghost" style="top: 30%; right: 15%;">🕯️</div>

  <script>
    const funFacts = [
      { icon: "🏪", title: "GHOST MARKET", text: "The first anonymous marketplace built into a messaging platform. Sell used items without anyone knowing who you are." },
      { icon: "🔑", title: "ZEUS-PIN", text: "Your identity is your PIN. No phone number needed. Ever. No tracking. No spam." },
      { icon: "💀", title: "SELF-DESTRUCT", text: "Messages disappear on a timer, keeping your most private conversations light, sharp, and hard to keep." },
      { icon: "👻", title: "GHOST TOWN", text: "Posts vanish after 24 hours. What happens in Ghost Town stays in Ghost Town." },
      { icon: "💰", title: "GET PAID", text: "Earn 80% of every paid post. Your content, your value, your earnings." },
      { icon: "🌍", title: "YOUR LANGUAGE", text: "Speak Swahili, Yoruba, Zulu, Hausa, Igbo, or Amharic. ZeusChat speaks your language." }
    ];

    let currentFact = 0;

    function rotateFunFact() {
      currentFact = (currentFact + 1) % funFacts.length;
      const fact = funFacts[currentFact];
      document.getElementById('funFactIcon').textContent = fact.icon;
      document.getElementById('funFactTitle').textContent = fact.title;
      document.getElementById('funFactText').textContent = fact.text;
    }

    setInterval(rotateFunFact, 8000);

    document.getElementById("email").addEventListener("keypress", function (e) {
      if (e.key === "Enter") saveEmail();
    });

    function saveEmail() {
      const emailInput = document.getElementById("email");
      const nextBtn = document.getElementById("nextBtn");

      if (nextBtn.disabled) return;

      nextBtn.disabled = true;
      nextBtn.textContent = "Processing...";

      let email = emailInput.value.trim().toLowerCase();

      if (!email) {
        alert("Please enter your email.");
        nextBtn.disabled = false;
        nextBtn.textContent = "Continue →";
        return;
      }

      const emailRegex = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$/;

      if (!emailRegex.test(email)) {
        alert("Please enter a valid email address.");
        nextBtn.disabled = false;
        nextBtn.textContent = "Continue →";
        return;
      }

      const API_BASE = window.location.origin;

      fetch(`${API_BASE}/api/start-signup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          localStorage.setItem("pending_email", email);
          console.log('✅ OTP sent to:', email);
          window.location.href = "otp-verify.html";
        } else {
          alert(data.error || 'Failed to send OTP. Please try again.');
          nextBtn.disabled = false;
          nextBtn.textContent = "Continue →";
        }
      })
      .catch(error => {
        console.error('❌ Signup error:', error);
        alert('Network error. Please check your connection.');
        nextBtn.disabled = false;
        nextBtn.textContent = "Continue →";
      });
    }
  </script>
  <script src="/static/premium.js"></script>
</body>
</html>
